<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sections 101</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a full-screen deck of drafting sheets; each slide = header strip + one working area (figure left, explanation right); control bar fixed at the bottom */
:root{
  --bg:#eceff4; --paper:#f8f9fb; --surface:#ffffff; --ink:#131a28; --muted:#566074; --line:#cbd1dc;
  --accent:#2443c4; --accent-soft:rgba(36,67,196,.10); --accent-ink:#ffffff;
  --cut:#c62f3d; --cut-soft:rgba(198,47,61,.10); --stage:#dde3ec; --ok:#1c7a49; --ok-soft:rgba(28,122,73,.12); --bad:#b3261e; --warn:#b07400;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1219; --paper:#121823; --surface:#171e2b; --ink:#e4e9f2; --muted:#97a1b4; --line:#2a3446;
    --accent:#8ea4ff; --accent-soft:rgba(142,164,255,.14); --accent-ink:#0e1219;
    --cut:#ff6b72; --cut-soft:rgba(255,107,114,.14); --stage:#1a2232; --ok:#5fd394; --ok-soft:rgba(95,211,148,.14); --bad:#ff8a80; --warn:#f0b54a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1219; --paper:#121823; --surface:#171e2b; --ink:#e4e9f2; --muted:#97a1b4; --line:#2a3446;
  --accent:#8ea4ff; --accent-soft:rgba(142,164,255,.14); --accent-ink:#0e1219;
  --cut:#ff6b72; --cut-soft:rgba(255,107,114,.14); --stage:#1a2232; --ok:#5fd394; --ok-soft:rgba(95,211,148,.14); --bad:#ff8a80; --warn:#f0b54a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:clamp(15px,1.15vw,19px);line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0;max-width:62ch}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72em;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cutc{color:var(--cut)}

/* deck */
.deck{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px)}
.slide{position:absolute;inset:0;display:none;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,2vh,22px);padding-block:clamp(16px,3.2vh,36px) calc(78px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px),3vw);padding-right:max(16px,env(safe-area-inset-right,0px),3vw);overflow-y:auto;overflow-x:hidden}
.slide.on{display:grid;animation:sIn .45s cubic-bezier(.2,.7,.2,1)}
.slide.on.back{animation-name:sInB}
@keyframes sIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes sInB{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.sh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 20px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:10px}
.sh .no{font-family:var(--f-mono);font-size:.78em;font-weight:600;border:1.5px solid var(--ink);padding:3px 8px;line-height:1.2;align-self:center}
.sh h2{font-stretch:112%;font-weight:780;font-size:clamp(1.5rem,2.9vw,2.6rem);line-height:1.02}
.sh .part{font-family:var(--f-mono);font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;white-space:nowrap}
.sb{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(16px,2.4vw,36px);min-height:0}
.sb.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sb.one{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.fig{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.fig.grow{flex:1;min-height:340px}
.fig .cap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.68em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fig .area{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:auto}
.fig .area>svg{width:100%;height:100%;max-height:100%}
.lead{font-size:1.12em}
.pts{margin:0;padding-left:1.1em;display:grid;gap:8px}
.pts li::marker{color:var(--accent)}
.pts b{font-weight:600}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;font-size:.95em;border-radius:0 4px 4px 0}
.callout.cut{border-color:var(--cut);background:var(--cut-soft)}
.btn{background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:3px;cursor:pointer;font-size:.88em;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 13px;cursor:pointer;font-size:.86em;font-weight:600}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{font-family:var(--f-mono);font-size:.7em;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted)}
.activity-tag{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.72em;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 9px;border-radius:2px}
.sw{width:22px;height:16px;border:1px solid var(--ink);background-size:32px;flex:none;display:inline-block;vertical-align:middle}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.bar .nav{width:42px;height:40px;border-radius:3px;border:1px solid var(--ink);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;flex:none}
.bar .nav.next{background:var(--ink);color:var(--bg)}
.bar .nav:disabled{opacity:.35;cursor:default}
.bar select{font:inherit;font-size:.82em;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:7px 8px;min-width:0;flex:1 1 auto;max-width:420px}
.bar .count{font-family:var(--f-mono);font-size:.8em;white-space:nowrap}
.bar .spacer{flex:1}
.bar .tool{border:1px solid var(--line);background:var(--surface);border-radius:3px;height:40px;padding:0 11px;cursor:pointer;font-size:.8em;white-space:nowrap}
.bar .tool[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.live{display:inline-flex;gap:7px;align-items:center;font-size:.8em;border:1px solid var(--line);border-radius:20px;padding:5px 11px;white-space:nowrap;cursor:pointer;background:var(--surface)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.progress{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--cut);z-index:41;transition:width .4s}
.notes{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:39;max-width:760px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:4px;padding:12px 16px;font-size:.9em;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.notes b{font-family:var(--f-mono);font-size:.75em;letter-spacing:.08em;text-transform:uppercase;opacity:.7;display:block;margin-bottom:4px;font-weight:500}

/* title slide */
.title-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(20px,3vw,48px);align-items:center;min-height:0}
.title-wrap h1{font-stretch:124%;font-weight:820;font-size:clamp(2.6rem,6.4vw,6.2rem);line-height:.92;letter-spacing:-.015em}
.title-wrap .sub{font-family:var(--f-display);font-stretch:108%;font-weight:600;font-size:clamp(1.1rem,1.9vw,1.6rem);margin-top:16px;color:var(--muted)}
.title-wrap .topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.title-wrap .topics span{border:1.5px solid var(--ink);padding:4px 12px;font-weight:600;font-size:.92em}
.agenda{display:grid;gap:0;border-top:1px solid var(--ink)}
.agenda button{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:14px;align-items:baseline;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 4px;cursor:pointer}
.agenda button:hover{background:var(--accent-soft)}
.agenda .n{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:1.8em;color:var(--accent);line-height:1}
.agenda .t{font-family:var(--f-display);font-stretch:110%;font-weight:700;font-size:1.25em}
.agenda.big{max-width:880px;width:100%;align-self:start}
.agenda.big button{grid-template-columns:2.4em minmax(0,1fr);padding:clamp(14px,2.6vh,24px) 6px}
.agenda.big .n{font-size:2.4em}
.agenda.big .t{font-size:clamp(1.3rem,2.4vw,2rem)}
.agenda .d{display:block;font-size:.85em;color:var(--muted);font-family:var(--f-body);font-weight:400}

/* drawings */
.dwg{display:block;width:100%;height:100%;background:var(--paper)}
.dwg text{font-family:var(--f-mono);font-size:9.5px;fill:var(--ink)}
.dwg .halo{paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.dwg .g-cut>*{fill:none;stroke:var(--ink);stroke-width:2.1;stroke-linejoin:miter}
.dwg .g-glz>*{fill:none;stroke:var(--ink);stroke-width:1}
.dwg .g-beyond>*{fill:none;stroke:var(--ink);stroke-width:.7;opacity:.85}
.dwg .g-beyond>.ent{stroke-width:.55;opacity:.55}
.dwg .g-hidden>*{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:6 4;opacity:.8}
.dwg .g-hatch.blank>*{fill:var(--paper)!important}
.dwg .g-datum line{stroke:var(--accent);stroke-width:.6;stroke-dasharray:12 6;opacity:.55}
.dwg .g-grid line{stroke:var(--muted);stroke-width:.6;stroke-dasharray:18 4 3 4}
.dwg .g-grid circle{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.dwg .g-grid text{font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.dwg .g-dims line{stroke:var(--ink);stroke-width:.6}
.dwg .g-levels line{stroke:var(--ink);stroke-width:.6}
.dwg .g-levels polygon{stroke:var(--ink);stroke-width:.8;fill:var(--paper)}
.dwg .g-levels polygon.f{fill:var(--ink);stroke:none}
.dwg .g-levels .lv{font-weight:600}
.dwg .g-anno polyline{stroke:var(--ink);stroke-width:.55;fill:none}
.dwg .g-anno circle{fill:var(--ink)}
.dwg .g-anno .room{font-family:var(--f-display);font-stretch:115%;font-weight:700;font-size:11px;text-anchor:middle;fill:var(--muted)}
.dwg .g-title .t{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:19px}
.dwg .g-title circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.dwg .g-title line{stroke:var(--ink);stroke-width:1}
.dwg.uniform .g-cut>*,.dwg.uniform .g-glz>*,.dwg.uniform .g-beyond>*{stroke-width:.8;opacity:1}
.dwg .hot{cursor:pointer}
.dwg .hot .ring{fill:var(--accent);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.dwg .hot .dot{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.dwg .hot text{fill:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dwg .hot:hover .dot,.dwg .hot:focus .dot,.dwg .hot.sel .dot{fill:var(--cut)}
.dwg .hot:focus{outline:none}
@keyframes pulse{0%{transform:scale(.8);opacity:.45}70%{transform:scale(1.9);opacity:0}100%{opacity:0}}
.anim .draw{stroke-dasharray:1;animation:dwgDraw 1.2s cubic-bezier(.3,.6,.2,1) both;animation-delay:calc(var(--i,0) * 9ms)}
.anim.fade{animation:dwgFade .9s ease both}
@keyframes dwgDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes dwgFade{from{opacity:0}to{opacity:1}}
.det text{font-family:var(--f-mono);font-size:10px;fill:var(--ink)}
.det .h{stroke:var(--ink);stroke-width:1.6}
.det .t{stroke:var(--ink);stroke-width:.7;fill:none}
.det .ld{stroke:var(--ink);stroke-width:.55;fill:none}
.det .dpc{stroke:var(--cut);stroke-width:3;fill:none;stroke-dasharray:7 4}
.det .dpcs{stroke:var(--ink);stroke-width:2.2;fill:none}
.det .lvl circle{fill:var(--paper);stroke:var(--ink);stroke-width:.9}
.det .lvl path{fill:var(--ink)}
.det .lvl line{stroke:var(--ink);stroke-width:.7}
.det .lvl text{font-weight:600}
.det .hl{fill:var(--accent);opacity:.18}
.det .flow{stroke-dasharray:1000;stroke-dashoffset:1000;animation:flow 2.6s ease forwards}
@keyframes flow{to{stroke-dashoffset:0}}

/* plan */
.plan .pl-side{fill:var(--accent-soft)}
.plan .pl-road{fill:var(--line);opacity:.6}
.plan .wall{fill:url(#hp-brick);stroke:var(--ink);stroke-width:1.6}
.plan .col{fill:var(--ink)}
.plan .thin{fill:none;stroke:var(--ink);stroke-width:.7}
.plan .dash{fill:none;stroke:var(--ink);stroke-width:.7;stroke-dasharray:4 3}
.plan .gl{stroke:var(--muted);stroke-width:.6;stroke-dasharray:14 3 2 3}
.plan .gb{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.plan text{font-family:var(--f-mono);font-size:10px;fill:var(--ink)}
.plan .gt{font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.plan .rm{font-family:var(--f-display);font-stretch:115%;font-weight:700;font-size:12px;fill:var(--muted)}
.plan .cl{stroke:var(--cut);stroke-width:1.6;fill:none}
.plan .cl-end{stroke:var(--cut);stroke-width:4;fill:none}
.plan .cl-tag{fill:var(--paper);stroke:var(--cut);stroke-width:1.6}
.plan .cl-arr{fill:var(--cut)}
.plan .cl-l{fill:var(--cut);font-weight:600;font-size:11px;text-anchor:middle;dominant-baseline:central}
.plan .hit{fill:transparent;cursor:ew-resize}
.plan.draggable{cursor:crosshair;touch-action:none}
.plan .cand{cursor:pointer}
.plan .cand line{stroke-width:2.2;stroke-dasharray:14 4 3 4}
.plan .cand .hitl{stroke:transparent;stroke-width:26;stroke-dasharray:none}
.plan .cand text{font-family:var(--f-display);font-weight:800;font-size:14px;text-anchor:middle;dominant-baseline:central}
.plan .cand circle{stroke-width:1.8}

/* 3D viewer */
.viewer{position:relative;flex:1;min-height:320px;background:var(--stage);border:1px solid var(--line);border-radius:4px;overflow:hidden;touch-action:none}
.viewer canvas{display:block;width:100%;height:100%}
.v-chip{position:absolute;top:10px;left:10px;font-family:var(--f-mono);font-size:.66em;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);padding:4px 8px;border-radius:3px;pointer-events:none}
.v-legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px);pointer-events:none}
.v-legend span{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:3px 7px 3px 3px;border-radius:3px;font-size:.66em;font-family:var(--f-mono)}
.v-fail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.slider{display:flex;align-items:center;gap:10px;font-size:.85em;color:var(--muted);flex:1 1 220px;min-width:0}
.slider input{flex:1;min-width:0;accent-color:var(--cut)}
.slider output{color:var(--ink);min-width:4.6em;text-align:right}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88em;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

/* readout */
.readout{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.readout h4{margin:0 0 4px;font-family:var(--f-mono);font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.readout ul{margin:0;padding-left:18px;font-size:.88em;display:grid;gap:2px}
.readout .cutlist li::marker{color:var(--cut)}
.verdict{grid-column:1/-1;border-left:3px solid var(--ok);padding:6px 10px;font-size:.88em;background:var(--paper)}
.verdict.warn{border-color:var(--cut)}
.verdict.mid{border-color:var(--warn)}

/* stepper */
.stepcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px}
.stepcard .num{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:2.6em;line-height:1;color:var(--accent)}
.stepcard h3{margin:6px 0;font-size:1.25em}
.stepcard .tip{margin-top:10px;font-size:.88em;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:.78em;font-weight:600}
.dots button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots button.done{background:var(--ink);color:var(--bg)}

/* real drawing */
.realwrap{position:relative;width:100%;max-height:100%;aspect-ratio:1720/1000;max-width:100%}
.realwrap img{width:100%;height:100%;display:block;object-fit:contain;background:#fff}
:root[data-theme="dark"] .realwrap img{filter:invert(.9) hue-rotate(180deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .realwrap img{filter:invert(.9) hue-rotate(180deg)}}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:2px solid var(--paper);font-family:var(--f-display);font-weight:800;font-size:14px;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 0 var(--accent);animation:pinp 2.4s infinite}
.pin.sel{background:var(--cut);animation:none}
@keyframes pinp{0%{box-shadow:0 0 0 0 rgba(36,67,196,.45)}70%{box-shadow:0 0 0 14px rgba(36,67,196,0)}100%{box-shadow:0 0 0 0 rgba(36,67,196,0)}}
.infocard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;min-height:9em}
.infocard h3{font-size:1.2em;margin-bottom:6px}
.infocard .k{font-family:var(--f-mono);font-size:.7em;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}

/* layers widget */
.lw-stage{position:relative;flex:1;min-height:300px;perspective:1300px;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.lw-stage .ctl{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2;flex-wrap:wrap}
.lw-stage .ctl .btn{font-size:.75em;padding:5px 9px}

<script>

const HATCH_INFO={

function rng(seed){let r=seed%2147483647;if(r<=0)r+=2147483646;return()=>{r=(r*16807)%2147483647;return(r-1)/2147483646}}

function cutLineMarkup(mode,c,flip){
  const top=PZ(-6.5),bot=PZ(8.75),d=flip?-1:1,L=mode==='b'?'B':'A';let pts;
  if(mode==='jog')pts=[[PX(2.6),top],[PX(2.6),PZ(1.0)],[PX(-2.9),PZ(1.0)],[PX(-2.9),bot]];else pts=[[PX(c),top],[PX(c),bot]];
  let s=`<polyline class="cl" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  [[pts[0][0],top,-1],[pts[pts.length-1][0],bot,1]].forEach(([x,y,v])=>{s+=`<line class="cl-end" x1="${x}" y1="${y}" x2="${x}" y2="${y-v*16}"/>`;const cy=y+v*16;s+=`<polygon class="cl-arr" points="${x+d*11},${cy-7} ${x+d*11},${cy+7} ${x+d*24},${cy}"/><circle class="cl-tag" cx="${x}" cy="${cy}" r="11"/><text class="cl-l" x="${x}" y="${cy}">${L}</text>`});
  s+=`<rect class="hit" x="${Math.min(...pts.map(p=>p[0]))-14}" y="${top-30}" width="${Math.max(...pts.map(p=>p[0]))-Math.min(...pts.map(p=>p[0]))+28}" height="${bot-top+60}"/>`;

function analyze(c,flip){
  const cut=[],bey=[],inR=(a,b)=>c>=a&&c<=b,ahead=(a,b)=>flip?(b<c):(a>c);
  if(c<-6||c>6)return{cut:['Nothing: the plane misses the building'],bey:['The whole facade'],v:'That gives an elevation, not a section. Move the line onto the building.',tone:'warn'};
  const wall=inR(-6,-5.75)||inR(5.75,6);if(wall)cut.push('A side wall along its whole length');
  const cols=[];[[-5.75,'1'],[0,'2'],[5.75,'3']].forEach(([g,l])=>{if(Math.abs(c-g)<=0.25)cols.push(l)});cols.forEach(l=>cut.push(`Column line ${l}: columns and beams`));
  cut.push('Slabs, beams, ground and street layers');
  if(inR(1.8,3.4))cut.push('Entrance door and stair');if(inR(-4.4,-1.6))cut.push('Shop window');
  if(inR(2.2,3.8)||inR(-3.8,-2.2))cut.push('Front windows, upper floors');if(inR(-3.8,-2.2))cut.push('Back windows');
  if(inR(2.0,3.2))cut.push('Stair flight 1 and landing');if(inR(3.3,4.5))cut.push('Stair flight 2 and landing');if(inR(1.75,4.75))cut.push('Stair room on the roof');
  if(ahead(2.0,3.2))bey.push('Stair flight 1');if(ahead(3.3,4.5))bey.push('Stair flight 2');
  [[-5.75,'1'],[0,'2'],[5.75,'3']].forEach(([g,l])=>{if(ahead(g-0.25,g+0.25))bey.push(`Columns on line ${l}`)});
  bey.push(flip?'West end wall and its windows':'East end wall and its windows');
  const stair=cut.some(t=>t.startsWith('Stair flight')),open=cut.some(t=>/window|door/i.test(t));let v,tone;
  if(wall||cols.length){v='Avoid running the plane along a wall or column line: it gives a confusing strip of solid poché.';tone='warn'}
  else if(stair&&open){v='Strong section: it explains the stair and gives sill and head heights.';tone='ok'}
  else if(stair){v='Good: the stair is cut. Shift a little to catch a window as well.';tone='mid'}
  else if(open){v='Readable, but the stair is missing. Most buildings need one section through the stair.';tone='mid'}
  else{v='Weak: nothing here explains levels or openings.';tone='warn'}
  return{cut,bey,v,tone};
}

function pat(k){return `url(#hp-${k})`}
function lvlMark(x,y,txt,sub,left){const tx=left?x-26:x+26;return `<g class="lvl"><line x1="${left?x-60:x}" y1="${y}" x2="${left?x:x+60}" y2="${y}"/><circle cx="${x}" cy="${y}" r="9"/><path d="M${x-9} ${y} A9 9 0 0 0 ${x+9} ${y} Z"/><text x="${tx}" y="${y-5}" text-anchor="${left?'end':'start'}">${txt}</text>${sub?`<text x="${tx}" y="${y+12}" text-anchor="${left?'end':'start'}" style="font-weight:400;font-size:9px">${sub}</text>`:''}</g>`}
/* Exploded "layer ladder": one hatched band per layer, fanned back to that layer's real top and bottom on the drawing */
function ladder(o){
  const left=o.side==='l',rowH=o.bh+o.gap,rows=o.rows||[],ex=o.extras||[];
  const names=rows.map(r=>r.name).concat(ex.map(e=>e.name));const tw=Math.max(6,...names.map(n=>n.length))*0.61*o.f;
  const ks=[...new Set(rows.map(r=>r.k).filter(k=>k!=='membrane'))];
  let s=`<defs>${ks.map(k=>`<pattern id="${o.pid}-${k}" patternUnits="userSpaceOnUse" width="${o.ps}" height="${o.ps}"><image href="${HURL[k]}" width="${o.ps}" height="${o.ps}" preserveAspectRatio="none"/></pattern>`).join('')}</defs>`;
  const n=rows.length+ex.length;const px0=left?o.x0-tw-o.f*1.1:o.x0-o.f*0.6;const pw=tw+o.bw+o.f*1.7;
  s+=`<rect class="lpanel" x="${px0}" y="${o.y0-o.f*0.6}" width="${pw}" height="${n*rowH+o.f*0.8}" rx="${o.f*0.3}"/>`;
  const tx=left?o.x0-o.f*0.5:o.x0+o.bw+o.f*0.5,anchor=left?'end':'start',bx=left?o.x0+o.bw:o.x0;
  if(rows.length)s+=`<line class="ledge" x1="${o.edgeX}" y1="${rows[0].yt}" x2="${o.edgeX}" y2="${rows[rows.length-1].yb}"/>`;
  rows.forEach((r,i)=>{const y=o.y0+i*rowH;
    s+=`<polygon class="lfanfill" points="${bx},${y} ${o.edgeX},${r.yt} ${o.edgeX},${r.yb} ${bx},${y+o.bh}"/><polyline class="lfan" points="${bx},${y} ${o.edgeX},${r.yt}"/><polyline class="lfan" points="${bx},${y+o.bh} ${o.edgeX},${r.yb}"/>`;
    s+=`<rect class="lband" x="${o.x0}" y="${y}" width="${o.bw}" height="${o.bh}" fill="${r.k==='membrane'?'var(--cut)':`url(#${o.pid}-${r.k})`}"/>`;
    s+=`<text class="ltext${r.k==='membrane'?' ldpc':''}" x="${tx}" y="${y+o.bh*0.74}" text-anchor="${anchor}" style="font-size:${o.f}px">${r.name}</text>`});
  ex.forEach((e,j)=>{const y=o.y0+(rows.length+j)*rowH+o.bh*0.5;const ax=o.x0+o.bw/2;
    s+=`<polyline class="lfan2" points="${e.px},${e.py} ${ax},${y}"/><circle class="ldot" cx="${e.px}" cy="${e.py}" r="${o.f*0.22}"/><circle class="lring" cx="${ax}" cy="${y}" r="${o.f*0.32}"/>`;
    s+=`<text class="ltext" x="${tx}" y="${y+o.f*0.34}" text-anchor="${anchor}" style="font-size:${o.f}px">${e.name}</text>`});
  return s;
}
function LR(Y,rows){return rows.map(r=>({name:r[0],k:r[1],yt:Y(r[2]),yb:Y(r[3])}))}
function labelList(items,x,y0,dy){return items.map((it,i)=>{const y=y0+i*dy;return `<polyline class="ld" points="${it[1]},${it[2]} ${x-6},${y-3} ${x},${y-3}"/><circle cx="${it[1]}" cy="${it[2]}" r="1.8" style="fill:var(--ink)"/><text x="${x+4}" y="${y}">${it[0]}</text>`}).join('')}

/* Organised annotation, as in the lecture drawings: one leader runs through the layers to a stacked layer table */
function noteTable(o){

  const w=o.w||Math.max(wRows,o.title?o.title.length*0.6*f*0.85+2*pad:0);
  const right=o.side!=='l',x0=right?o.x-w:o.x,x1=right?o.x:o.x+w,top=o.ty-nt*rh;
  let s=`<g class="ntab"><rect class="nbg" x="${x0}" y="${top}" width="${w}" height="${o.ty-top}"/>`,y=top;
  if(o.title){s+=`<text class="nttl" x="${x0+pad}" y="${y+rh*0.68}" style="font-size:${f*0.85}px">${o.title}</text>`;y+=rh;s+=`<line class="nrule nr2" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`}
  rows.forEach(r=>{const c=r[2]?' ndpc':'';s+=`<text class="nrow${c}" x="${x0+pad}" y="${y+rh*0.7}" style="font-size:${f}px">${r[0]}</text>`;if(r[1])s+=`<text class="nrow${c}" x="${x1-pad}" y="${y+rh*0.7}" text-anchor="end" style="font-size:${f}px">${r[1]}</text>`;y+=rh;s+=`<line class="nrule" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`});

add({id:'section3d',t:'What is a section?',part:P1,html:()=>H('What is a section?',P1)+`<div class="sb"><div class="col"><div class="viewer" id="viewer3d"><div class="v-chip">Live model · drag to orbit · scroll to zoom</div><div class="v-legend" id="vLegend"></div></div>
  <div class="row"><div class="seg" role="group" aria-label="Camera"><button data-view="iso" aria-pressed="true">3D</button><button data-view="section" aria-pressed="false">Section</button><button data-view="plan" aria-pressed="false">Plan</button></div>
  <label class="slider" for="cutRange"><span>Cut</span><input type="range" id="cutRange" min="-7.2" max="6.5" step="0.05" value="2.6"><output id="cutOut" class="mono">8.60 m</output></label>
  <button class="btn" id="flip3">Flip</button><button class="btn primary" id="replay3">Replay the cut</button>
  <label class="chk"><input type="checkbox" id="tgCut" checked> Cut</label><label class="chk"><input type="checkbox" id="tgPlane" checked> Plane</label><label class="chk"><input type="checkbox" id="tgLevels" checked> Levels</label></div></div>
  <div class="col"><div class="fig" style="height:clamp(170px,30vh,280px)"><div class="cap"><span>The same cut on the plan</span><span>Moves with the model</span></div><div class="area" id="s3plan"></div></div>
  <p>A section is what you see when an imaginary <b class="cutc">vertical plane</b> slices the building and the front part is removed. The plan shows <b>where</b> that plane passes: the cut line.</p>
  <ul class="pts" style="font-size:.92em"><li><b>Cut</b>: sliced by the plane. Heavy and hatched.</li><li><b>Beyond</b>: seen behind the plane. Thin.</li><li><b>Hidden</b>: footings in the soil. Dashed.</li></ul>
  <p class="callout cut" id="cutNote"></p></div></div>`,
  init(el){
    el.querySelector('#s3plan').innerHTML=planMarkup();
    init3D(el.querySelector('#viewer3d'));
    el.querySelector('#vLegend').innerHTML=[['rc','R.C.'],['brick','Brick'],['pc','P.C.'],['membrane','D.P.C.'],['insul','Insulation'],['fill','Back fill'],['soil','Soil']].map(([k,l])=>`<span><i class="sw" data-h="${k}"></i>${l}</span>`).join('');paintSwatches(el);
    el.querySelector('#cutRange').oninput=e=>{cutAnim=null;setCut3(+e.target.value)};
    el.querySelector('#flip3').onclick=()=>{st3.flip=!st3.flip;setCut3(st3.c)};
    el.querySelector('#replay3').onclick=()=>{if(V3.ready)V3.goView('iso');playCut()};
    el.querySelector('#tgCut').onchange=e=>{st3.on=e.target.checked;setCut3(st3.c)};
    el.querySelector('#tgPlane').onchange=()=>setCut3(st3.c);
    el.querySelector('#tgLevels').onchange=e=>V3.ready&&V3.levels(e.target.checked);
    el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>V3.ready&&V3.goView(b.dataset.view));
    setCut3(V3.ready?-7.2:2.6);
  },
  enter(){V3.active=true;if(V3.size)setTimeout(V3.size,30);if(!this._played){this._played=true;setTimeout(playCut,500)}},
  leave(){V3.active=false}});

const REAL_PINS=[[41,3.6,'Grid lines','The same grid letters as the plans (A to F). Every section must show them so it can be read against the plan.'],[5.2,56,'External dimension chains','Three chains on the outside: openings, floor heights, and the overall height of 8.65.'],[84,80,'Level marks','Outdoor floor level ±0.00, ground F.F.L. +0.30, first floor, roof S.L. and roof level. Each mark says F.F.L. or S.L.'],[19,22,'Roof layer table','Skirting, tiles, mortar, sand, inclined P.C. 7 cm av., D.P.C., thermal insulation, R.C. slab 20 cm.'],[4,93,'Ground floor layer table','Tiles 2, mortar 2, sand 6, P.C. 10, D.P.C. 2, P.C. 15, back fill.'],[18,41.4,'Door tag D20','Doors and windows carry the tag from the door and window schedule. Its height is dimensioned on the internal chain.'],[51,40.4,'Window tag W24','The window is beyond the cut, so it is drawn thin with its tag.'],[37.4,49,'Stair','The stair is drawn so that it explains how you move between levels.'],[52.3,59.4,'Cut slab','The slab is cut by the plane, so it is drawn heavy and hatched.'],[44.5,69,'Internal dimensions','Inside the rooms: floor-to-ceiling heights (3.50) and opening heights.']];
add({id:'real',t:'Reading a real section',part:P1,html:()=>H('Reading a real section',P1)+`<div class="sb"><div class="fig grow"><div class="cap"><span>Section from the course lecture</span><span>Tap a number</span></div><div class="area" style="padding:10px"><div class="realwrap" id="realwrap"><img alt="Two-storey building section from the course lecture" src="${REAL_IMG}"></div></div></div><div class="col"><p class="lead">Before drawing one, learn to read one. Every working section carries the same kinds of information.</p><div class="infocard" id="realInfo"><span class="k">Tap a number on the drawing</span><h3>Ten things to look for</h3><p>Grids, chains, levels, layer tables, tags, the stair, cut and beyond elements.</p></div><div class="row"><button class="btn" id="realPrev">Previous</button><button class="btn primary" id="realNext">Next</button></div></div></div>`,
  init(el){const w=el.querySelector('#realwrap');let cur=-1;
    w.insertAdjacentHTML('beforeend',REAL_PINS.map((p,i)=>`<button class="pin" style="left:${p[0]}%;top:${p[1]}%" data-i="${i}" aria-label="${p[2]}">${i+1}</button>`).join(''));
    const show=i=>{cur=(i+REAL_PINS.length)%REAL_PINS.length;const p=REAL_PINS[cur];el.querySelector('#realInfo').innerHTML=`<span class="k">${cur+1} of ${REAL_PINS.length}</span><h3>${p[2]}</h3><p>${p[3]}</p>`;w.querySelectorAll('.pin').forEach((b,j)=>b.classList.toggle('sel',j===cur))};
    w.querySelectorAll('.pin').forEach(b=>b.onclick=()=>show(+b.dataset.i));el.querySelector('#realNext').onclick=()=>show(cur+1);el.querySelector('#realPrev').onclick=()=>show(cur-1)}});

add({id:'cutline',t:'The cut line',part:P1,html:()=>H('What is a cut line?',P1)+`<div class="sb even"><div class="fig grow"><div class="cap"><span>Ground floor plan</span><span>Drag the red line</span></div><div class="area" id="cutPlan"></div><div class="row" style="padding:8px 10px;border-top:1px solid var(--line)"><button class="btn" data-preset="a" aria-pressed="true">A–A through the stair</button><button class="btn" data-preset="jog" aria-pressed="false">Staggered line</button><button class="btn" id="flipPlan">Flip arrows</button></div></div>
  <div class="col"><p>The cut line is drawn on the plan. It shows <b>where</b> the vertical plane passes and the arrows show <b>which way you look</b>.</p>
  <svg class="dwg" viewBox="0 0 380 150" style="height:auto;max-height:150px;background:transparent" role="img" aria-label="Parts of a cut line"><line x1="62" y1="80" x2="318" y2="80" stroke="var(--cut)" stroke-width="1.4"/><line x1="44" y1="80" x2="66" y2="80" stroke="var(--cut)" stroke-width="4.5"/><line x1="314" y1="80" x2="336" y2="80" stroke="var(--cut)" stroke-width="4.5"/><circle cx="30" cy="80" r="15" fill="var(--paper)" stroke="var(--cut)" stroke-width="1.6"/><text x="30" y="85" text-anchor="middle" style="font-size:12px;font-weight:600;fill:var(--cut)">A</text><polygon points="18,95 42,95 30,112" fill="var(--cut)"/><circle cx="350" cy="80" r="15" fill="var(--paper)" stroke="var(--cut)" stroke-width="1.6"/><text x="350" y="85" text-anchor="middle" style="font-size:12px;font-weight:600;fill:var(--cut)">A</text><polygon points="338,95 362,95 350,112" fill="var(--cut)"/><g style="font-size:9px"><polyline points="30,65 30,30 60,30" fill="none" stroke="var(--ink)" stroke-width=".5"/><text x="64" y="33">Section letter</text><polyline points="350,112 350,136 320,136" fill="none" stroke="var(--ink)" stroke-width=".5"/><text x="316" y="139" text-anchor="end">Arrow = direction of view</text><polyline points="200,80 230,20" fill="none" stroke="var(--ink)" stroke-width=".5"/><text x="234" y="23">Thin solid line</text><polyline points="56,80 110,128" fill="none" stroke="var(--ink)" stroke-width=".5"/><text x="114" y="131">Heavy ends</text></g></svg>
  <div class="readout" id="readout"></div></div></div>`,
  init(el){const host=el.querySelector('#cutPlan');host.innerHTML=planMarkup('draggable');const svg=host.querySelector('svg'),g=svg.querySelector('.cutg');
    const P={c:2.6,flip:false,mode:'a'};
    const draw=()=>{g.innerHTML=cutLineMarkup(P.mode,P.c,P.flip);const a=analyze(P.mode==='jog'?2.6:P.c,P.flip);
      el.querySelector('#readout').innerHTML=`<div><h4>Cut by the plane</h4><ul class="cutlist">${a.cut.map(t=>`<li>${t}</li>`).join('')}${P.mode==='jog'?'<li>Shop window, after the jog</li>':''}</ul></div><div><h4>Seen beyond</h4><ul>${a.bey.map(t=>`<li>${t}</li>`).join('')}</ul></div><div class="verdict ${P.mode==='jog'?'':a.tone==='warn'?'warn':a.tone==='mid'?'mid':''}">${P.mode==='jog'?'A staggered line catches both the stair and the shop window. The jog appears on the plan only; the section is drawn as one continuous cut.':a.v}</div>`;
      el.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.preset===P.mode))};
    const toC=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return Math.max(-6.5,Math.min(6.5,(q.x-50)/30-6))};
    let drag=false;svg.addEventListener('pointerdown',e=>{drag=true;svg.setPointerCapture(e.pointerId);P.mode='a';P.c=toC(e);draw()});svg.addEventListener('pointermove',e=>{if(drag){P.c=toC(e);draw()}});svg.addEventListener('pointerup',()=>drag=false);svg.addEventListener('pointercancel',()=>drag=false);
    el.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{P.mode=b.dataset.preset;P.c=2.6;draw()});el.querySelector('#flipPlan').onclick=()=>{P.flip=!P.flip;draw()};draw()}});

add({id:'trycut',t:'Try it: choose the cut',part:P1,html:()=>H('<span class="activity-tag">Try it</span> Which cut line would you draw?',P1)+`<div class="sb even"><div class="fig grow"><div class="cap"><span>Three candidate lines</span><span>Tap one</span></div><div class="area" id="candPlan"></div></div><div class="col"><p class="lead">You may draw only <b>one</b> section of this building. Which line gives the most information?</p><div class="row" id="candBtns"></div><div class="result" id="candRes">Pick 1, 2 or 3.</div><p class="callout">Think about: the stair, the openings, and what the plane slices along its length.</p></div></div>`,
  init(el){const host=el.querySelector('#candPlan');host.innerHTML=planMarkup();const g=host.querySelector('.cutg');
    const C=[[0,'1','Along column line 2'],[2.6,'2','Through the stair and the entrance'],[-2.9,'3','Through the shop window']];
    const R={1:['Not this one. The plane runs along column line 2, so every column and beam on that line becomes a long strip of solid cut. It hides the stair and explains nothing.',false],2:['Correct. It cuts both stair flights, the entrance door and the upper windows, so it shows how you climb between levels and gives sill and head heights.',true],3:['It shows the shop window well, but it misses the stair completely. You would still need a second section through the stair.',false]};
    const pick=n=>{g.querySelectorAll('.cand').forEach(c=>{c.style.opacity=c.dataset.n===n?1:.35});el.querySelectorAll('#candBtns button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.n===n));const r=el.querySelector('#candRes');r.textContent=R[n][0];r.className='result '+(R[n][1]?'good':'badr')};
    g.innerHTML=C.map(([x,n])=>`<g class="cand" data-n="${n}"><line class="hitl" x1="${PX(x)}" y1="${PZ(-6.3)}" x2="${PX(x)}" y2="${PZ(8.6)}"/><line x1="${PX(x)}" y1="${PZ(-6.3)}" x2="${PX(x)}" y2="${PZ(8.6)}" stroke="var(--cut)"/><circle cx="${PX(x)}" cy="${PZ(-6.6)}" r="12" fill="var(--paper)" stroke="var(--cut)"/><text x="${PX(x)}" y="${PZ(-6.6)}" fill="var(--cut)">${n}</text></g>`).join('');
    g.querySelectorAll('.cand').forEach(c=>c.onclick=()=>pick(c.dataset.n));
    el.querySelector('#candBtns').innerHTML=C.map(c=>`<button class="btn" data-n="${c[1]}" aria-pressed="false">${c[1]} · ${c[2]}</button>`).join('');el.querySelectorAll('#candBtns button').forEach(b=>b.onclick=()=>pick(b.dataset.n))}});

/* ---------- PART 2: zoom tour ---------- */
const ZSTOPS=[
  {id:'full',name:'The whole section',level:'Section A–A · 1:50',desc:'The tour climbs from the street to the roof: street level, ground floor, typical floor, then the roof. The basement is an extra stop. At each stop the drawing zooms in until every layer can be read.'},
  {id:'street',n:1,name:'Street level',level:'Road ±0.00 · sidewalk +0.15',c:[13.4,0.05],w:7,side:'r',lx:11.6,ttl:'SIDEWALK +0.15',key:'ground',v:2,slide:'l_ground',desc:'The street is the ±0.00 datum for every level on the drawings. The kerb lifts the sidewalk 15 cm.',rows:[['Pavers','6 cm','interlock',0.15,0.09],['Sand bed','3 cm','sand',0.09,0.06],['P.C. base','10 cm','pc',0.06,-0.04],['Crushed stone','36 cm','gravel',-0.04,-0.40]],extras:[['Kerb 15 × 30, sidewalk +0.15',12.92,0.12],['Asphalt 5 + 7 cm, road ±0.00',13.6,-0.06],['Aggregate base 28 cm',13.7,-0.26]]},
  {id:'ground',n:2,name:'Ground floor',level:'F.F.L. +0.45',c:[8.3,0.25],w:4.2,side:'l',lx:9.2,ttl:'GROUND FLOOR +0.45',key:'ground',v:0,slide:'l_ground',desc:'The floor sits on back fill, so a D.P.C. is sandwiched between two plain concrete layers. At the wall it turns up and wraps the tie beam: down the inside face, under the beam, up the outside face, and tucks into the wall.',rows:[['Floor tiles','2 cm','tile',0.45,0.43],['Mortar','2 cm','mortar',0.43,0.41],['Sand','6 cm','sand',0.41,0.35],['P.C.','10 cm','pc',0.35,0.25],['D.P.C.','2 cm','membrane',0.25,0.23],['P.C.','15 cm','pc',0.23,0.08],['Back fill','','fill',0.08,-0.40]],extras:[['Tie beam 25 × 60',9.875,-0.1],['D.P.C. wraps the tie beam',9.74,0.0],['Plinth wall under the door',9.875,0.32]]},
  {id:'typical',n:3,name:'Typical floor',level:'F.F.L. +3.45 · S.L. +3.35',c:[8.3,3.35],w:3.8,side:'l',lx:9.2,ttl:'TYPICAL FLOOR +3.45',key:'typical',v:0,slide:'l_typical',desc:'On the structural slab the build-up is only 10 cm: tiles, mortar and sand, with plaster and paint underneath.',rows:[['Floor tiles','2 cm','tile',3.45,3.43],['Mortar','2 cm','mortar',3.43,3.41],['Sand','6 cm','sand',3.41,3.35],['R.C. slab','15 cm','rc',3.35,3.20],['Plaster + paint','2 cm','plaster',3.20,3.18]],extras:[['R.C. beam 25 × 50',9.875,3.0],['Skirting 10 cm',9.74,3.52],['Precast sill, W1 at +0.90',9.88,4.33]]},
  {id:'roof',n:4,name:'Roof',level:'S.L. +9.35 · finish +9.59 av.',c:[8.9,9.85],w:3.8,side:'l',lx:9.5,ttl:'ROOF +9.59 (AV.)',key:'roof',v:0,slide:'l_roof',desc:'The D.P.C. lies directly on the slab, runs up behind the sloped skirting and tucks into the parapet. Insulation and inclined P.C. sit above it.',rows:[['Floor tiles','2 cm','tile',9.59,9.57],['Mortar','2 cm','mortar',9.57,9.55],['Sand (av.)','6 cm','sand',9.55,9.49],['Inclined P.C.','7 cm','screed',9.49,9.42],['Insulation','5 cm','insul',9.42,9.37],['D.P.C.','2 cm','membrane',9.37,9.35],['R.C. slab','15 cm','rc',9.35,9.20],['Plaster','2 cm','plaster',9.20,9.18]],extras:[['Brick parapet 25 cm, 0.90 high',9.87,9.95],['Precast coping',9.87,10.2],['Skirting 20 cm, sloped top',9.715,9.62],['D.P.C. tucked into the parapet',9.74,9.82]]},
  {id:'basement',n:5,name:'Basement (option)',level:'F.F.L. −1.80',detail:true,key:'basement',v:0,slide:'l_basement',desc:'Section A–A has no basement, so this extra stop opens the basement detail. Below ground the D.P.C. wraps the walls and the floor.'}
];
add({id:'zoom',t:'The layers of each level',part:P2,html:()=>H('The layers of each level',P2)+`<div class="sb"><div class="col"><div class="fig grow zoomable"><div class="cap"><span id="zCap">Section A–A · whole building</span><span>Tap a marker or a stop</span></div><div class="area" id="zHost"></div><div class="zdet" id="zDet" hidden></div></div><div class="tabs" id="zStops"></div></div><div class="col"><div class="infocard" id="zInfo"></div><div class="row"><button class="btn" id="zPrev">Previous</button><button class="btn primary" id="zNext">Next stop</button><button class="btn" id="zTour">Pause the tour</button></div></div></div>`,
  init(el){
    const HOT=ZSTOPS.filter(z=>z.c).map(z=>[z.id,z.n,z.id==='street'?15.8:7.0,z.id==='street'?-0.06:z.c[1]+(z.id==='roof'?-0.35:0.05),z.name]);
    const host=el.querySelector('#zHost');host.innerHTML=sectionMarkup({hot:HOT,vb:'60 36 1065 744'});const svg=host.querySelector('svg');svg._vb=[60,36,1065,744];
    const zl=document.createElementNS('http://www.w3.org/2000/svg','g');zl.setAttribute('class','zl');svg.appendChild(zl);
    let cur=0,tour=null,tStart=null,raf=null;
    const target=z=>{if(!z.c)return[60,36,1065,744];const w=z.w*40,h=w/1.45;return[SX(z.c[0])-w/2,SY(z.c[1])-h/2,w,h]};
    const anim=(to,done)=>{cancelAnimationFrame(raf);const from=svg._vb.slice(),t0=performance.now(),d=reduce?1:1100;const step=t=>{const k=Math.min(1,(t-t0)/d),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;const v=from.map((a,i)=>a+(to[i]-a)*e);svg.setAttribute('viewBox',v.join(' '));svg._vb=v;if(k<1)raf=requestAnimationFrame(step);else done&&done()};raf=requestAnimationFrame(step)};
    const labels=z=>{const vw=svg._vb[2],f=vw*0.017;let s='';const rows=z.rows||[];
      if(rows.length){const ys=rows.map(r=>(SY(r[3])+SY(r[4]))/2);s+=noteTable({x:SX(z.lx),side:z.side==='l'?'r':'l',ty:SY(rows[0][3])-f*2.4,title:z.ttl,f,r:f*0.17,rows:rows.map(r=>[r[0],r[1],r[2]==='membrane']),ys})}
      (z.extras||[]).forEach((e,i)=>s+=`<g class="zmk"><circle cx="${SX(e[1])}" cy="${SY(e[2])}" r="${f*0.72}"/><text x="${SX(e[1])}" y="${SY(e[2])}" style="font-size:${f*0.85}px">${i+1}</text></g>`);
      zl.innerHTML=s;zl.classList.remove('newin');void zl.getBoundingClientRect();zl.classList.add('newin')};
    const info=z=>{const i=ZSTOPS.indexOf(z);const L=z.key?LCFG[z.key][z.v].layers:null;
      el.querySelector('#zInfo').innerHTML=`<span class="k">${i===0?'Overview':'Stop '+i+' of '+(ZSTOPS.length-1)}</span><h3>${z.name}</h3><p class="mono" style="font-size:.85em;color:var(--muted);margin-bottom:6px">${z.level}</p><p style="font-size:.95em">${z.desc}</p>${L?`<ol class="zlist">${L.map(l=>`<li class="${l[2]==='membrane'?'dpc':''}"><span class="sw" data-h="${l[2]}"></span>${l[0]}<span class="mono">${l[1]?l[1]+' cm':''}</span></li>`).join('')}</ol>`:''}${z.extras?`<div class="zx">${z.extras.map((e,j)=>`<span><b>${j+1}</b>${e[0]}</span>`).join('')}</div>`:''}${L?`<div class="row" style="margin-top:10px"><button class="btn primary" id="zPop">Open the layer pop-up</button><button class="btn" id="zGo">Go to the ${z.name.replace(' (option)','').toLowerCase()} slide</button></div>`:''}`;
      paintSwatches(el.querySelector('#zInfo'));const pb=el.querySelector('#zPop');if(pb)pb.onclick=()=>openLayers(z.key,z.v);const gb=el.querySelector('#zGo');if(gb)gb.onclick=()=>goId(z.slide)};
    const stopTour=()=>{clearTimeout(tStart);tStart=null;if(tour){clearInterval(tour);tour=null}el.querySelector('#zTour').textContent='Play the tour'};
    const goStop=(i,fromTour)=>{if(!fromTour&&(tour||tStart))stopTour();
      cur=(i+ZSTOPS.length)%ZSTOPS.length;const z=ZSTOPS[cur];zl.innerHTML='';
      el.querySelectorAll('#zStops button').forEach((b,j)=>b.setAttribute('aria-pressed',j===cur));el.querySelector('#zCap').textContent=z.id==='full'?'Section A–A · whole building':'Zoomed: '+z.name;
      const det=el.querySelector('#zDet');
      if(z.detail){det.innerHTML=basementDetail();det.hidden=false;det.classList.remove('newin');void det.offsetWidth;det.classList.add('newin');svg.classList.add('zoomed');anim([60,36,1065,744])}
      else{det.hidden=true;svg.classList.toggle('zoomed',z.id!=='full');anim(target(z),()=>{if(z.rows)labels(z)})}
      info(z)};
    const play=delay=>{stopTour();el.querySelector('#zTour').textContent='Pause the tour';tStart=setTimeout(()=>{tStart=null;goStop(1,true);tour=setInterval(()=>{if(cur>=ZSTOPS.length-1){stopTour();return}goStop(cur+1,true)},5600)},delay)};
    el.querySelector('#zStops').innerHTML=ZSTOPS.map((z,i)=>`<button aria-pressed="${i===0}">${i?i+' · ':''}${z.name}</button>`).join('');
    el.querySelectorAll('#zStops button').forEach((b,i)=>b.onclick=()=>goStop(i));
    svg.querySelectorAll('.hot').forEach(h=>{const f=()=>goStop(ZSTOPS.findIndex(z=>z.id===h.dataset.k));h.addEventListener('click',f);h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});
    el.querySelector('#zNext').onclick=()=>goStop(cur+1);el.querySelector('#zPrev').onclick=()=>goStop(cur-1);
    el.querySelector('#zTour').onclick=()=>{if(tour||tStart){stopTour();return}play(0)};
    this._reset=()=>{stopTour();goStop(0)};this._play=play;info(ZSTOPS[0]);
  },
  enter(){this._reset&&this._reset();this._play&&this._play(1800)},leave(){this._reset&&this._reset()}});

function layerSlide(id,title,key,lead,notes){add({id,t:title,part:P2,html:()=>H(title,P2)+`<div class="sb"><div class="col lwh"></div><div class="col"><p class="lead">${lead}</p><div class="ltab"></div></div></div>`,init(el){layersWidget(el.querySelector('.lwh'),{variants:LCFG[key],table:el.querySelector('.ltab')})},notes})}
layerSlide('l_ground','Street, outdoor platform and ground floor','ground','The ground floor sits on back fill, so it needs a <b class="cutc">D.P.C.</b> sandwiched between two plain concrete layers. Outside, the platform, sidewalk and road have no D.P.C.','Point out the D.P.C. between the two P.C. layers and the 10 cm skirting. Use the tabs for the platform, sidewalk and road.');
layerSlide('l_typical','Typical floor','typical','Upper floors sit on the structural slab, so the build-up is short: tiles, mortar and sand on the R.C. slab, with plaster and paint underneath.','Stress the difference between S.L. (top of structural slab) and F.F.L. (top of tile). It returns in Part 5.');
layerSlide('l_roof','Roof','roof','The roof keeps out water and heat. Read the layers from the top down: the D.P.C. lies directly on the slab.','Point out the coping, cant strip and turned-up D.P.C. The sloped P.C. averages 7 cm because it makes falls to the outlets.');
layerSlide('l_basement','Basement','basement','Below ground, water presses on the walls as well as the floor, so the D.P.C. has to wrap the whole basement.','The dashed line on the lecture drawing is the tanking. Ask: what happens if there is a gap where the wall meets the floor?');
layerSlide('l_stair','Entrance stair','stair','The entrance stair links the outdoor level to the ground F.F.L. Its landing has the same layers as the ground floor, with granite instead of tiles.','Ask students to check: 3 risers × 15 cm = 45 cm, the difference between ±0.00 and +0.45.');

add({id:'trybuild',t:'Try it: build the floor',part:P2,html:()=>H('<span class="activity-tag">Try it</span> Build the floor',P2)+`<div class="sb even"><div class="col"><div class="row"><div class="tabs" id="bfTabs"></div></div><p style="font-size:.9em;color:var(--muted)">Put the layers in order from the <b>top</b> (finish) to the <b>bottom</b>. Drag, tap two to swap, or use the arrows.</p><div class="sorter" id="sorter"></div><div class="row"><button class="btn primary" id="bfCheck">Check my order</button><button class="btn" id="bfShuffle">Shuffle again</button></div></div><div class="col"><div class="result" id="bfRes">Four stacks to build.</div><div class="fig" style="flex:1;min-height:220px"><div class="area" id="bfPreview"></div></div></div></div>`,
  init(el){const SETS={ground:['Ground floor',LAY.ground],typical:['Typical',LAY.typical],roof:['Roof',LAY.roof],basement:['Basement',LAY.basement]};let key='ground',order=[],picked=-1,checked=false;
    const shuffle=n=>{const a=[...Array(n).keys()];let r=rng(key.length*7+Date.now()%97);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.every((v,i)=>v===i))a.reverse();return a};
    const tabs=el.querySelector('#bfTabs');tabs.innerHTML=Object.entries(SETS).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===key}">${v[0]}</button>`).join('');
    const L=()=>SETS[key][1];
    const render=()=>{const s=el.querySelector('#sorter');s.innerHTML=order.map((ix,pos)=>{const l=L()[ix];const cls=checked?(ix===pos?'right':'wrong'):'';return `<div class="sitem ${cls} ${picked===pos?'pick':''}" draggable="true" data-pos="${pos}"><span class="ix">${pos+1}</span><span class="sw" data-h="${l[2]}"></span><span>${l[0]}${l[1]?` <span class="mono" style="color:var(--muted);font-size:.85em">${l[1]} cm</span>`:''}</span><span class="mv"><button data-mv="-1" aria-label="Move up">↑</button><button data-mv="1" aria-label="Move down">↓</button></span></div>`}).join('');paintSwatches(s);
      s.querySelectorAll('.sitem').forEach(it=>{const pos=+it.dataset.pos;
        it.querySelectorAll('[data-mv]').forEach(b=>b.onclick=e=>{e.stopPropagation();const t=pos+ +b.dataset.mv;if(t<0||t>=order.length)return;[order[pos],order[t]]=[order[t],order[pos]];checked=false;picked=-1;render()});
        it.onclick=()=>{if(picked<0){picked=pos}else if(picked===pos){picked=-1}else{[order[pos],order[picked]]=[order[picked],order[pos]];picked=-1;checked=false}render()};
        it.ondragstart=e=>{e.dataTransfer.setData('text/plain',pos);it.classList.add('dragging')};it.ondragend=()=>it.classList.remove('dragging');
        it.ondragover=e=>e.preventDefault();it.ondrop=e=>{e.preventDefault();const from=+e.dataTransfer.getData('text/plain');const v=order.splice(from,1)[0];order.splice(pos,0,v);checked=false;render()}});
      const pv=el.querySelector('#bfPreview');const Ls=order.map(i=>L()[i]);const W=360;let y=14;const hh=l=>l[1]?Math.max(10,l[1]*4.2):26;
      pv.innerHTML=`<svg viewBox="0 0 560 ${Ls.reduce((a,l)=>a+hh(l),0)+28}" style="width:100%;height:100%" preserveAspectRatio="xMidYMid meet">${Ls.map(l=>{const h=hh(l);const r=`<rect x="20" y="${y}" width="${W}" height="${h}" fill="${pat(l[2])}" stroke="var(--ink)" stroke-width="${l[2]==='membrane'?2:.8}"/><text x="${W+30}" y="${y+h/2+4}" style="font-family:var(--f-mono);font-size:12px;fill:var(--ink)">${l[0]}</text>`;y+=h;return r}).join('')}</svg>`};
    const load=k=>{key=k;order=shuffle(L().length);checked=false;picked=-1;tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));el.querySelector('#bfRes').className='result';el.querySelector('#bfRes').textContent=`${SETS[k][0]}: ${L().length} layers. Top first.`;render()};
    tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.k));
    el.querySelector('#bfShuffle').onclick=()=>load(key);
    el.querySelector('#bfCheck').onclick=()=>{checked=true;const n=order.filter((v,i)=>v===i).length;const r=el.querySelector('#bfRes');const all=n===order.length;r.className='result '+(all?'good':'badr');
      const dpcPos=L().findIndex(l=>l[2]==='membrane'),dpcAt=order.indexOf(dpcPos);
      r.innerHTML=all?`All ${n} layers in the right order.`:`${n} of ${order.length} in the right place.`+(dpcPos>=0&&dpcAt!==dpcPos?` Check the <b class="cutc">D.P.C.</b>: ${key==='roof'?'on the roof it lies directly on the slab.':'it sits between the two P.C. layers.'}`:' Look at the red rows.');render()};
    load('ground')}});

function mirrorSvg(){
  const panel=(x0,ok)=>{let p='';const c=ok?'var(--ok)':'var(--bad)';
    p+=`<text x="${x0+170}" y="22" text-anchor="middle" style="font-family:var(--f-display);font-weight:800;font-size:15px;fill:${c}">${ok?'✓ Arrows point away from the section':'✗ Arrows point at the section'}</text>`;
    p+=`<rect x="${x0+40}" y="50" width="260" height="90" fill="url(#hp-brick)" style="stroke:var(--ink);stroke-width:1.6"/><rect x="${x0+48}" y="58" width="244" height="74" style="fill:var(--paper)"/>`;
    p+=`<rect x="${x0+56}" y="64" width="54" height="62" style="fill:none;stroke:var(--ink);stroke-width:.8"/>`+[0,1,2,3,4,5].map(k=>`<line x1="${x0+56+k*9}" y1="64" x2="${x0+56+k*9}" y2="126" style="stroke:var(--ink);stroke-width:.6"/>`).join('')+`<text x="${x0+83}" y="148" text-anchor="middle" style="font-size:10px">STAIR</text>`;
    p+=`<rect x="${x0+250}" y="50" width="40" height="8" style="fill:var(--paper);stroke:var(--ink);stroke-width:.8"/><text x="${x0+270}" y="44" text-anchor="middle" style="font-size:10px">WINDOW</text>`;
    const cy=95;p+=`<line x1="${x0+20}" y1="${cy}" x2="${x0+320}" y2="${cy}" style="stroke:var(--cut);stroke-width:1.6"/>`;
    [x0+20,x0+320].forEach(x=>{p+=ok?`<polygon points="${x-7},${cy-6} ${x+7},${cy-6} ${x},${cy-20}" style="fill:var(--cut)"/>`:`<polygon points="${x-7},${cy+6} ${x+7},${cy+6} ${x},${cy+20}" style="fill:var(--cut)"/>`;p+=`<circle cx="${x}" cy="${cy}" r="8" style="fill:var(--paper);stroke:var(--cut);stroke-width:1.4"/><text x="${x}" y="${cy+4}" text-anchor="middle" style="fill:var(--cut);font-weight:600;font-size:10px">A</text>`});
    [40,56,110,250,290,300].forEach(dx=>p+=`<line x1="${x0+dx}" y1="${cy}" x2="${x0+dx}" y2="185" style="stroke:var(--accent);stroke-width:.8;stroke-dasharray:5 4"/>`);
    const st=ok?[x0+56,x0+110]:[x0+230,x0+284];const wx=ok?[x0+250,x0+290]:[x0+50,x0+90];
    p+=`<rect x="${x0+40}" y="190" width="260" height="120" style="fill:none;stroke:var(--ink);stroke-width:1.8"/><line x1="${x0+40}" y1="250" x2="${x0+300}" y2="250" style="stroke:var(--ink);stroke-width:1.8"/>`;
    p+=`<polyline points="${st[1]},305 ${st[1]},297 ${st[1]-9},297 ${st[1]-9},289 ${st[1]-18},289 ${st[1]-18},281 ${st[1]-27},281 ${st[1]-27},273 ${st[1]-36},273 ${st[1]-36},265 ${st[1]-45},265 ${st[1]-45},257 ${st[0]},257 ${st[0]},250" style="fill:none;stroke:var(--ink);stroke-width:1.4"/>`;
    p+=`<rect x="${wx[0]}" y="205" width="${wx[1]-wx[0]}" height="30" style="fill:none;stroke:var(--ink);stroke-width:.8"/><text x="${(wx[0]+wx[1])/2}" y="200" text-anchor="middle" style="font-size:9px">WINDOW</text>`;
    p+=`<text x="${x0+170}" y="335" text-anchor="middle" style="font-size:11px;font-weight:600;fill:${c}">${ok?'Stair on the left in plan and section':'From these arrows you really see the stair on the right'}</text>`;
    if(!ok)p+=`<text x="${x0+170}" y="352" text-anchor="middle" style="font-size:11px;fill:${c}">Projecting straight down would draw it mirrored</text>`;
    return p};
  return `<svg class="det" viewBox="0 0 720 365" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Correct and mirrored projection from plan to section">${panel(10,true)}${panel(370,false)}</svg>`}

add({id:'cad',t:'AutoCAD: drawing the section step by step',part:P3,html:()=>H('Drawing the section in AutoCAD',P3)+`<div class="sb cadsb"><div class="fig grow"><div class="cap"><span>Plan above, section below</span><span id="cadLbl">Step 1 of ${CAD_STEPS.length}</span></div><div class="area" id="cadHost"></div></div><div class="col"><div class="stepcard" aria-live="polite"><div class="num mono" id="cadNum">01</div><h3 id="cadT"></h3><p id="cadX"></p><p class="tip" id="cadTip"></p></div><div class="cmd" id="cadCmd"></div><div class="row"><button class="btn" id="cadPrev">Back</button><button class="btn primary" id="cadNext">Next step</button></div><div class="dots wrap" id="cadDots"></div></div></div>`,
  init(el){const host=el.querySelector('#cadHost');host.innerHTML=sectionMarkup({plan:true,vb:'20 -330 1105 1140'});const svg=host.querySelector('svg');let cur=1;
    const dots=el.querySelector('#cadDots');dots.innerHTML=CAD_STEPS.map((s,i)=>`<button aria-label="Step ${i+1}: ${s.t}" title="${s.t}">${i+1}</button>`).join('');
    const go2=n=>{const prevN=cur;cur=Math.max(1,Math.min(CAD_STEPS.length,n));const st=CAD_STEPS[cur-1];
      const gs=new Set(),ks=new Set(),ps=new Set();let hatch=false;CAD_STEPS.slice(0,cur).forEach(s=>{(s.g||[]).forEach(x=>gs.add(x));(s.k||[]).forEach(x=>ks.add(x));(s.p||[]).forEach(x=>ps.add(x));if(s.hatch)hatch=true});
      const plot=!!st.plot,fresh=prevN<cur;const sh=(c,on)=>{const was=isVis(c);vis(c,on);if(on&&!was&&fresh)showIn(c)};
      svg.querySelectorAll('g[data-g]').forEach(g=>{const name=g.dataset.g;
        if(['cut','beyond','hidden','glz','hatch','datum','anno'].includes(name)){vis(g,true);[...g.children].forEach(c=>sh(c,ks.has(c.dataset.k)&&(name!=='hatch'||hatch)))}
        else if(name==='proj'){vis(g,!plot);[...g.children].forEach(c=>sh(c,ps.has(c.dataset.p)))}
        else if(name==='plan'){vis(g,!plot);g.style.opacity=cur>=4?.55:1}
        else if(name==='ident'){sh(g,!!st.ident)}
        else sh(g,gs.has(name))});
      svg.setAttribute('viewBox',plot?'16 30 1109 780':'20 -330 1105 1140');
      el.querySelector('#cadNum').textContent=String(cur).padStart(2,'0');el.querySelector('#cadT').textContent=st.t;el.querySelector('#cadX').textContent=st.x;el.querySelector('#cadTip').textContent=st.tip;el.querySelector('#cadLbl').textContent=`Step ${cur} of ${CAD_STEPS.length}`;
      cmdStrip(el.querySelector('#cadCmd'),st.cmd);
      [...dots.children].forEach((b,i)=>{b.removeAttribute('aria-current');b.classList.toggle('done',i+1<cur);if(i+1===cur)b.setAttribute('aria-current','step')});el.querySelector('#cadPrev').disabled=cur===1;el.querySelector('#cadNext').textContent=cur===CAD_STEPS.length?'Start again':'Next step'};
    [...dots.children].forEach((b,i)=>b.onclick=()=>go2(i+1));el.querySelector('#cadPrev').onclick=()=>go2(cur-1);el.querySelector('#cadNext').onclick=()=>go2(cur===CAD_STEPS.length?1:cur+1);
    this._go=go2;cur=0;go2(1)},
  enter(){this._go&&this._go(1)}});

add({id:'hatching',t:'Hatching and line weights',part:P3,html:()=>H('Hatching and line weights in AutoCAD',P3)+`<div class="sb even"><div class="col"><div class="hgrid" id="hgrid"></div><p style="font-size:.8em;color:var(--muted)">Pattern names are typical AutoCAD choices. Follow your studio standard where it differs, and use the same pattern for a material on every drawing.</p></div><div class="col"><div style="overflow-x:auto"><table class="lwt" id="lwt"></table></div><ul class="pts" style="font-size:.92em"><li>Hatch only what is <b>cut</b>. Elements beyond stay as outlines.</li><li>Set the HATCH scale so lines print about 1.5 to 3 mm apart at 1:50; test on one plot first.</li><li>Thin layers like the D.P.C. become one heavy line, not a hatch.</li><li>At 1:100 slabs and walls can be solid; at 1:50 use material hatches; at 1:20 draw every layer.</li></ul></div></div>`,

/* ---------- PART 4: stairs ---------- */
function stairCad(){
  const X=s=>+(40+s*120).toFixed(1),PY=x=>+(40+(4.7-x)*110).toFixed(1),Y=h=>+(840-(h-3.1)*120).toFixed(1);
  const F=3.45,L=4.95,T=6.45;const g={};const push=(k,s)=>{(g[k]=g[k]||[]).push(s)};
  const thin='style="fill:none;stroke:var(--ink);stroke-width:.8"',heavy='style="fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:miter"';
  const RP=(s0,s1,x0,x1,st)=>`<rect x="${X(s0)}" y="${PY(x1)}" width="${X(s1)-X(s0)}" height="${PY(x0)-PY(x1)}" ${st}/>`;
  // plan
  push('plan',RP(0,0.25,1.9,4.7,'fill="url(#hp-brick)" style="stroke:var(--ink);stroke-width:1.4"')+RP(0.25,4.93,1.9,2.0,'fill="url(#hp-brick)" style="stroke:var(--ink);stroke-width:1.2"')+RP(0.25,4.93,4.5,4.635,'fill="url(#hp-brick)" style="stroke:var(--ink);stroke-width:1.2"'));
  push('plan',RP(0.25,1.9,2.0,4.5,thin)+RP(1.9,4.6,2.0,3.2,thin)+RP(1.9,4.6,3.3,4.5,thin)+RP(4.6,5.4,1.9,4.7,'style="fill:var(--accent-soft)"'));
  for(let k=1;k<9;k++){const s=1.9+k*0.30;push('plan',`<line x1="${X(s)}" y1="${PY(2.0)}" x2="${X(s)}" y2="${PY(3.2)}" ${thin}/><line x1="${X(s)}" y1="${PY(3.3)}" x2="${X(s)}" y2="${PY(4.5)}" ${thin}/>`)}
  push('plan',`<polyline points="${X(4.5)},${PY(2.35)} ${X(1.0)},${PY(2.35)} ${X(1.0)},${PY(3.9)} ${X(4.45)},${PY(3.9)}" style="fill:none;stroke:var(--ink);stroke-width:.7"/><polygon points="${X(4.45)},${PY(3.9)-5} ${X(4.6)},${PY(3.9)} ${X(4.45)},${PY(3.9)+5}" style="fill:var(--ink)"/><text x="${X(4.2)}" y="${PY(2.35)+14}">UP</text><text x="${X(2.2)}" y="${PY(2.0)+16}">FLIGHT 1 · 10 RISERS</text><text x="${X(2.2)}" y="${PY(4.5)-6}">FLIGHT 2 · 10 RISERS (BEYOND)</text><text x="${X(0.35)}" y="${PY(4.2)}">LANDING</text><text x="${X(4.7)}" y="${PY(4.2)}">FLOOR</text>`);
  const cy=PY(2.6);push('plan',`<line x1="${X(-0.2)}" y1="${cy}" x2="${X(5.3)}" y2="${cy}" style="stroke:var(--cut);stroke-width:1.5"/>`+[-0.2,5.3].map(s=>`<polygon points="${X(s)-7},${cy-12} ${X(s)+7},${cy-12} ${X(s)},${cy-25}" style="fill:var(--cut)"/><circle cx="${X(s)}" cy="${cy}" r="10" style="fill:var(--paper);stroke:var(--cut);stroke-width:1.5"/><text x="${X(s)}" y="${cy+4}" text-anchor="middle" style="fill:var(--cut);font-weight:600">A</text>`).join(''));
  push('plan',`<text x="${X(0)}" y="22" style="font-family:var(--f-display);font-weight:700;font-size:12px;fill:var(--muted)">STAIR PLAN (TYPICAL FLOOR), ROTATED · TREADS 0.30 · WIDTH 1.20</text>`);
  // base: back wall, floor slabs
  push('base',`<rect x="${X(0)}" y="${Y(6.7)}" width="${X(0.25)-X(0)}" height="${Y(3.1)-Y(6.7)}" fill="url(#hp-brick)" ${heavy}/>`);
  [[3.20,3.35,3.45],[6.20,6.35,6.45]].forEach(([a,b,c])=>push('base',`<rect x="${X(4.6)}" y="${Y(a)}" width="${X(4.85)-X(4.6)}" height="${Y(b-0.5)-Y(a)}" fill="url(#hp-rc)" ${heavy}/><rect x="${X(4.6)}" y="${Y(b)}" width="${X(5.5)-X(4.6)}" height="${Y(a)-Y(b)}" fill="url(#hp-rc)" ${heavy}/><rect x="${X(4.6)}" y="${Y(c)}" width="${X(5.5)-X(4.6)}" height="${Y(b)-Y(c)}" fill="url(#hp-sand)" ${thin}/>`));
  // levels
  [[F,'+3.45 F.F.L.'],[L,'+4.95 LANDING'],[T,'+6.45 F.F.L.']].forEach(([h,t])=>push('levels',`<line x1="${X(-0.2)}" y1="${Y(h)}" x2="${X(5.6)}" y2="${Y(h)}" style="stroke:var(--accent);stroke-width:.8;stroke-dasharray:10 5"/><text x="${X(5.62)}" y="${Y(h)+4}" style="font-weight:600">${t}</text>`));
  for(let k=1;k<20;k++){if(k===10)continue;const h=F+k*0.15;push('risers',`<line x1="${X(0.25)}" y1="${Y(h)}" x2="${X(4.6)}" y2="${Y(h)}" style="stroke:var(--ink);stroke-width:.4;opacity:.45"/>`)}
  push('risers',`<text x="${X(4.65)}" y="${Y(F+0.8)}" style="fill:var(--muted)">20 × 0.15</text>`);
  // projections
  [0.25,4.6].concat([...Array(9).keys()].map(k=>1.9+k*0.30)).forEach(s=>push('proj',`<line x1="${X(s)}" y1="${PY(2.0)}" x2="${X(s)}" y2="${Y(F-0.05)}" style="stroke:var(--accent);stroke-width:.7;stroke-dasharray:6 4;opacity:.8"/>`));
  // profile of flight 1 (cut)
  const pts=[[4.6,F]];for(let k=0;k<10;k++){const s=4.6-k*0.30;pts.push([s,F+(k+1)*0.15]);pts.push([Math.max(1.9,s-0.30),F+(k+1)*0.15])}pts.push([0.25,L]);
  const P=a=>a.map(p=>X(p[0])+','+Y(p[1])).join(' ');
  push('profile',`<polyline points="${P(pts)}" ${heavy}/>`);
  // waist slab and landing
  const fl=flight1(F);const poly=fl.pts.concat([[1.9,L],[0.25,L],[0.25,L-0.18],[1.56,L-0.18]]);push('waist',`<rect x="${X(1.65)}" y="${Y(L-0.18)}" width="${X(1.9)-X(1.65)}" height="${Y(L-0.5)-Y(L-0.18)}" fill="url(#hp-rc)" ${heavy}/><text x="${X(0.35)}" y="${Y(L-0.62)}">DROP BEAM 25×50 UNDER THE LANDING</text>`);
  push('waist',`<polygon points="${P(poly)}" fill="url(#hp-rc)" ${heavy}/><text x="${X(3.4)}" y="${Y(F+0.15)}">WAIST 15–18 cm</text><text x="${X(0.35)}" y="${Y(L-0.32)}">LANDING SLAB 18 cm</text>`);
  // beyond flight and handrails
  push('beyond',`<polygon points="${P(flight2(F))}" ${thin}/><text x="${X(2.6)}" y="${Y(L+1.25)}" style="fill:var(--muted)">FLIGHT 2, BEYOND (THIN)</text>`);
  push('rail',`<line x1="${X(4.6)}" y1="${Y(F+0.15+0.9)}" x2="${X(1.9)}" y2="${Y(L+0.9)}" ${thin}/><line x1="${X(1.9)}" y1="${Y(L+0.9)}" x2="${X(0.25)}" y2="${Y(L+0.9)}" ${thin}/>`+[4.45,3.85,3.25,2.65,2.05].map(s=>{const h=F+(4.6-s)/0.30*0.15+0.15;return `<line x1="${X(s)}" y1="${Y(h)}" x2="${X(s)}" y2="${Y(h+0.9)}" style="stroke:var(--ink);stroke-width:.5"/>`}).join('')+`<text x="${X(3.3)}" y="${Y(F+1.95)}">HANDRAIL 0.90</text>`);
  // headroom and dimensions
  push('head',`<line x1="${X(4.52)}" y1="${Y(F+0.15)}" x2="${X(4.52)}" y2="${Y(6.20)}" style="stroke:var(--cut);stroke-width:1.4"/><polygon points="${X(4.52)-4},${Y(6.20)+8} ${X(4.52)+4},${Y(6.20)+8} ${X(4.52)},${Y(6.20)}" style="fill:var(--cut)"/><polygon points="${X(4.52)-4},${Y(F+0.15)-8} ${X(4.52)+4},${Y(F+0.15)-8} ${X(4.52)},${Y(F+0.15)}" style="fill:var(--cut)"/><text x="${X(4.47)}" y="${Y(5.3)}" text-anchor="end" style="fill:var(--cut);font-weight:600">HEADROOM 2.60 ≥ 2.10</text>`);
  const vx=X(5.95);push('fin',`<line x1="${vx}" y1="${Y(F)}" x2="${vx}" y2="${Y(T)}" style="stroke:var(--ink);stroke-width:.7"/>`+[F,L,T].map(h=>`<line x1="${vx-5}" y1="${Y(h)+5}" x2="${vx+5}" y2="${Y(h)-5}" style="stroke:var(--ink);stroke-width:1.3"/>`).join('')+[[F,L],[L,T]].map(([a,b])=>`<text x="${vx-6}" y="${(Y(a)+Y(b))/2}" text-anchor="middle" transform="rotate(-90 ${vx-6} ${(Y(a)+Y(b))/2})">10 × 0.15 = 1.50</text>`).join(''));
  const hy=Y(3.0);push('fin',`<line x1="${X(0.25)}" y1="${hy}" x2="${X(4.6)}" y2="${hy}" style="stroke:var(--ink);stroke-width:.7"/>`+[0.25,1.9,4.6].map(s=>`<line x1="${X(s)-5}" y1="${hy+5}" x2="${X(s)+5}" y2="${hy-5}" style="stroke:var(--ink);stroke-width:1.3"/>`).join('')+`<text x="${(X(0.25)+X(1.9))/2}" y="${hy-5}" text-anchor="middle">1.65</text><text x="${(X(1.9)+X(4.6))/2}" y="${hy-5}" text-anchor="middle">9 × 0.30 = 2.70</text><text x="${X(2.0)}" y="${Y(F+0.35)}" style="font-size:9px">Marble tread 3 · riser 2 cm</text>`);
  const order=['plan','base','levels','risers','proj','beyond','rail','waist','profile','head','fin'];
  return `<svg class="det stair" viewBox="0 0 800 880" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stair projected from plan to section">${order.map(k=>`<g data-s="${k}">${(g[k]||[]).join('')}</g>`).join('')}</svg>`;
}

  {t:'Read the stair on the plan',x:'Floor-to-floor is 3.00 m. Two flights of 10 risers meet at a half landing; risers are 15 cm, treads 30 cm, and the flight is 1.20 m wide. Cut line A–A runs along flight 1.',tip:'Count the treads on the plan: a flight of 10 risers has 9 treads, because the last riser lands on the landing.',cmd:['DIST → check one tread: 0.30','DIST → check the flight width: 1.20'],s:['plan']},
  {t:'Mark the levels and riser lines',x:'Mark the two F.F.L.s and the half landing at +4.95, then divide the floor-to-floor height into 20 equal risers of 15 cm.',tip:'On this course: riser 15 cm, tread 30 cm. Number of risers = floor-to-floor ÷ 0.15 = 3.00 ÷ 0.15 = 20.',cmd:['OFFSET 3.00 → upper F.F.L.','OFFSET 1.50 → half landing +4.95','ARRAY (rectangular, 20 rows, 0.15) → riser lines'],s:['base','levels','risers']},
  {t:'Project the nosings from the plan',x:'Run a vertical line down from every tread edge on the plan. Where these lines cross the riser lines, the steps appear.',tip:'This is the same projection method as the walls in Part 3, applied to a harder element.',cmd:['XLINE → V through every nosing on the plan'],s:['proj']},

  {t:'Add the waist slab and landing',x:'Draw a line through the nosings and offset it below for the waist slab. Add the 18 cm landing slab and hatch the cut flight in R.C.',tip:'Hatch only flight 1; it is the only one the plane cuts.',cmd:['LINE through the nosings → OFFSET 0.15–0.18 for the waist','OFFSET 0.18 → landing slab','HATCH → R.C. pattern on the cut flight'],s:['waist']},

  {t:'Check the headroom and annotate',x:'Check the headroom under the slab edge above (at least 2.10 m), then dimension the risers and treads, mark the levels and label the finishes.',tip:'Comfort check: 2 × riser + tread = 2 × 15 + 30 = 60 cm.',cmd:['DIMLINEAR → headroom 2.60 ≥ 2.10','DIMCONTINUE → 10 × 0.15 risers, 9 × 0.30 treads','INSERT → levels +3.45, +4.95, +6.45','MLEADER → marble tread 3 cm, riser 2 cm'],s:['head','fin']}
];
add({id:'stairs',t:'How to draw a stair',part:P4,html:()=>H('How to draw a stair in section',P4)+`<div class="sb cadsb"><div class="fig grow"><div class="cap"><span>Stair plan above, section below · 1:25</span><span id="stLbl">Step 1 of 7</span></div><div class="area" id="stHost"></div></div><div class="col"><div class="stepcard" aria-live="polite"><div class="num mono" id="stNum">01</div><h3 id="stT"></h3><p id="stX"></p><p class="tip" id="stTip"></p></div><div class="cmd" id="stCmd"></div><div class="row"><button class="btn" id="stPrev">Back</button><button class="btn primary" id="stNext">Next step</button></div><div class="steplist" id="stDots"></div></div></div>`,
  init(el){const host=el.querySelector('#stHost');host.innerHTML=stairCad();const svg=host.querySelector('svg');let cur=0;const dots=el.querySelector('#stDots');dots.innerHTML=STAIR_STEPS.map((s,i)=>`<button aria-label="Step ${i+1}: ${s.t}"><span>${i+1}</span>${s.t}</button>`).join('');
    const go2=n=>{const prevN=cur;cur=Math.max(1,Math.min(STAIR_STEPS.length,n));const st=STAIR_STEPS[cur-1];const on=new Set();STAIR_STEPS.slice(0,cur).forEach(s=>s.s.forEach(x=>on.add(x)));
      svg.querySelectorAll('g[data-s]').forEach(g=>{const v=on.has(g.dataset.s);const was=isVis(g);vis(g,v);if(v&&!was&&cur>prevN)showIn(g)});
      svg.querySelector('g[data-s="proj"]').style.opacity=cur>4?.35:1;
      el.querySelector('#stNum').textContent=String(cur).padStart(2,'0');el.querySelector('#stT').textContent=st.t;el.querySelector('#stX').textContent=st.x;el.querySelector('#stTip').textContent=st.tip;el.querySelector('#stLbl').textContent=`Step ${cur} of ${STAIR_STEPS.length}`;cmdStrip(el.querySelector('#stCmd'),st.cmd);
      [...dots.children].forEach((b,i)=>{b.removeAttribute('aria-current');b.classList.toggle('done',i+1<cur);if(i+1===cur)b.setAttribute('aria-current','step')});el.querySelector('#stPrev').disabled=cur===1;el.querySelector('#stNext').textContent=cur===STAIR_STEPS.length?'Start again':'Next step'};
    [...dots.children].forEach((b,i)=>b.onclick=()=>go2(i+1));el.querySelector('#stPrev').onclick=()=>go2(cur-1);el.querySelector('#stNext').onclick=()=>go2(cur===STAIR_STEPS.length?1:cur+1);this._go=go2;go2(1)},
  enter(){this._go&&this._go(1)}});

add({id:'trystair',t:'Try it: size the stair',part:P4,html:()=>H('<span class="activity-tag">Try it</span> Size the stair',P4)+`<div class="sb even"><div class="col"><p class="lead">Work these out before you draw. Give each answer as a number.</p><div id="sqQs" style="display:grid;gap:8px"></div><button class="btn primary" id="sqCheck" style="justify-self:start">Check</button></div><div class="col"><div class="infocard"><span class="k">Rules of thumb</span><ul class="pts" style="font-size:.9em"><li>On this course: riser 15 cm, tread 30 cm.</li><li>Number of risers = floor-to-floor ÷ 0.15.</li><li>Treads in a flight = risers − 1.</li><li>Half landing at half the floor-to-floor height, at least as deep as the flight is wide.</li><li>Handrail about 0.90 m above the nosing line.</li><li>Headroom at least 2.10 m, measured vertically from the nosing line.</li></ul><p style="font-size:.8em;color:var(--muted);margin-top:8px">These are common guidelines. Check the code that applies to your project.</p></div><div class="result" id="sqRes">Five questions.</div></div></div>`,
  init(el){const Q=[['Floor-to-floor 3.00 m with 15 cm risers: how many risers?',20,'3.00 ÷ 0.15 = 20'],['Two equal flights from F.F.L. +3.45: what is the landing level?',4.95,'+3.45 + 10 × 0.15 = +4.95'],['How many treads in one flight of 10 risers?',9,'Treads = risers − 1 = 9'],['Tread 30 cm, riser 15 cm: what is 2R + T in cm?',60,'2 × 15 + 30 = 60'],['Entrance from ±0.00 to +0.45 with 15 cm risers: how many risers?',3,'0.45 ÷ 0.15 = 3']];
    el.querySelector('#sqQs').innerHTML=Q.map((q,i)=>`<div class="qin"><label for="sq${i}">${q[0]}</label><input id="sq${i}" inputmode="decimal" placeholder="?"><span class="fb" id="sqf${i}"></span><span class="why" id="sqw${i}" hidden>${q[2]}</span></div>`).join('');
    el.querySelector('#sqCheck').onclick=()=>{let n=0;Q.forEach((q,i)=>{const v=parseFloat(String(el.querySelector('#sq'+i).value).replace(',','.').replace('+',''));const ok=!isNaN(v)&&Math.abs(v-q[1])<0.006;if(ok)n++;const f=el.querySelector('#sqf'+i);f.textContent=isNaN(v)?'Enter a value':ok?'Correct':'Not yet';f.className='fb '+(ok?'ok':'no');el.querySelector('#sqw'+i).hidden=isNaN(v)});const r=el.querySelector('#sqRes');r.textContent=`${n} of 5 correct.`;r.className='result '+(n===5?'good':'badr')}}});

add({id:'finishing',t:'The section checklist',part:P5,html:()=>H('The section checklist',P5)+`<div class="sb"><div class="fig grow"><div class="cap"><span>Section A–A · tap an item to highlight it</span><span id="finLbl">Everything</span></div><div class="area" id="finHost"></div></div><div class="col"><div class="infocard" id="finInfo" style="min-height:0"><span class="k">The section checklist</span><p style="font-size:.92em">In the same order as the AutoCAD steps. Tap an item to highlight it on the drawing.</p></div><div class="spotlist" id="finList"></div><button class="btn" id="finAll" style="justify-self:start">Show everything</button></div></div>`,
  init(el){const host=el.querySelector('#finHost');host.innerHTML=sectionMarkup({vb:'60 36 1065 744',sched:true});const svg=host.querySelector('svg');
    el.querySelector('#finList').innerHTML=FIN.map((f,i)=>`<button data-i="${i}"><span class="mono">${String(i+1).padStart(2,'0')}</span>${f[0]}</button>`).join('');
    const clear=()=>{svg.classList.remove('spot');svg.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));el.querySelectorAll('#finList button').forEach(b=>b.setAttribute('aria-pressed','false'));el.querySelector('#finLbl').textContent='Everything';el.querySelector('#finInfo').innerHTML='<span class="k">The section checklist</span><p style="font-size:.92em">In the same order as the AutoCAD steps. Tap an item to highlight it on the drawing.</p>'};
    const sel=i=>{const f=FIN[i];svg.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));svg.classList.add('spot');svg.querySelectorAll(f[1]).forEach(e=>{if(e.tagName==='g'&&e.dataset.g)[...e.children].forEach(c=>c.classList.add('lit'));else e.classList.add('lit')});
      el.querySelectorAll('#finList button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i));el.querySelector('#finLbl').textContent=f[0];
      el.querySelector('#finInfo').innerHTML=`<span class="k">${i+1} of ${FIN.length}</span><h3>${f[0]}</h3><p style="font-size:.92em">${f[2]}</p>${f[3]==='layers'?`<div class="row" style="margin-top:8px"><button class="btn" data-pop="ground">Ground floor</button><button class="btn" data-pop="typical">Typical</button><button class="btn" data-pop="roof">Roof</button><button class="btn" data-pop="basement">Basement</button></div>`:''}`;

  [[0.45,2.65,'door'],[4.35,5.65],[7.35,8.65]].forEach(([a,b])=>{s+=`<rect x="${X0-1}" y="${Y(b)}" width="14" height="${(b-a)*42}" style="fill:var(--paper);stroke:var(--ink);stroke-width:1"/><line x1="${X0+6}" y1="${Y(b)}" x2="${X0+6}" y2="${Y(a)}" style="stroke:var(--ink);stroke-width:.6"/>`});
  [3.20,6.20,9.20].forEach(h=>{s+=`<rect x="${X0+12}" y="${Y(h+0.15)}" width="280" height="${0.15*42}" fill="${pat('rc')}" style="stroke:var(--ink);stroke-width:1.6"/><rect x="${X0}" y="${Y(h+0.15)}" width="12" height="${0.2*42}" fill="${pat('rc')}" style="stroke:var(--ink);stroke-width:1.6"/>`});
  s+=`<rect x="${X0+12}" y="${Y(0.45)}" width="280" height="${0.45*42}" fill="${pat('fill')}" style="stroke:var(--ink);stroke-width:1.2"/>`;
  [0.45,3.45,6.45].forEach(h=>s+=`<text x="${X0+170}" y="${Y(h)-8}" style="font-size:11px">F.F.L. ${fmtLv(h)}</text>`);
  s+=`<text x="${X0+170}" y="${Y(9.35)-14}" style="font-size:11px">ROOF S.L. +9.35</text>`;
  const chain=(key,x,label,cls,blank)=>{const P=DIM[key];let c=`<g class="chain ${cls}" data-c="${key}"><line x1="${x}" y1="${Y(P[0])}" x2="${x}" y2="${Y(P[P.length-1])}" style="stroke:var(--ink);stroke-width:.8"/>`;
    P.forEach(v=>{c+=`<line x1="${x-5}" y1="${Y(v)+5}" x2="${x+5}" y2="${Y(v)-5}" style="stroke:var(--ink);stroke-width:1.4"/><line x1="${x+3}" y1="${Y(v)}" x2="${X0-6}" y2="${Y(v)}" style="stroke:var(--ink);stroke-width:.4;opacity:.45"/>`});
    for(let k=0;k<P.length-1;k++){const m=(Y(P[k])+Y(P[k+1]))/2;const val=(P[k+1]-P[k]).toFixed(2);const isBlank=blank&&blank.includes(k);c+=`<text x="${x-6}" y="${m}" text-anchor="middle" transform="rotate(-90 ${x-6} ${m})" style="font-size:11px;${isBlank?'fill:var(--cut);font-weight:700':''}">${isBlank?String.fromCharCode(97+blank.indexOf(k)):val}</text>`}
    c+=`<text x="${x}" y="${Y(P[P.length-1])-14}" text-anchor="middle" style="font-size:10px;fill:var(--accent);font-weight:600">${label}</text></g>`;return c};
  s+=chain('open',360,'1',opts.cls1||'',opts.blank)+chain('floor',300,'2',opts.cls2||'')+chain('all',240,'3',opts.cls3||'');
  return `<svg class="dwg" viewBox="200 20 560 530" preserveAspectRatio="xMidYMid meet" role="img" aria-label="External dimension chains">${s}</svg>`;
}
add({id:'extdim',t:'External dimension lines',part:P5,html:()=>H('External dimension lines',P5)+`<div class="sb"><div class="fig grow"><div class="cap"><span>Front wall in section A–A</span><span>Three chains</span></div><div class="area" id="extDim"></div></div><div class="col"><p class="lead">Outside the section, heights are given by <b>three chains</b>, from the building outwards.</p><div id="chainInfo" style="display:grid;gap:8px"></div><div class="row"><button class="btn primary" id="chainNext">Show next chain</button><button class="btn" id="chainAll">Show all</button></div><p class="callout">Each chain must add up to the next one out: the openings chain adds up to the floor heights, and the floor heights add up to the overall height.</p></div></div>`,
