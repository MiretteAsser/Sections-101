    const INFO=[['1','Openings','Closest to the wall. Every change along the facade: plinth, door, sills, windows, the wall between, the parapet. Here 0.45 + 2.20 + 0.80 + 0.90 + 1.30 + 0.80 + 0.90 + 1.30 + 0.70 + 0.90.'],['2','Floor heights','Level to level: 0.45 plinth, 3.00 floor-to-floor, 3.00, 2.90 to the roof slab, 0.90 parapet.'],['3','Overall height','One dimension from ±0.00 to the top of the coping: 10.25 m.']];
    const show=k=>{n=k;svg.querySelectorAll('.chain').forEach((c,i)=>{c.style.opacity=i<n?1:0;c.style.transition='opacity .5s'});
      el.querySelector('#chainInfo').innerHTML=INFO.map((x,i)=>`<div class="infocard" style="min-height:0;padding:10px 14px;opacity:${i<n?1:.4}"><span class="k">Chain ${x[0]}</span><b>${x[1]}</b><p style="font-size:.88em">${x[2]}</p></div>`).join('');el.querySelector('#chainNext').disabled=n>=3};
    el.querySelector('#chainNext').onclick=()=>show(Math.min(3,n+1));el.querySelector('#chainAll').onclick=()=>show(3);this._show=show;show(0)},
  enter(){if(this._show)this._show(0)}});

function roomSvg(){const Y=h=>460-h*130,X=s=>80+s*130;let s='';
  s+=`<rect x="${X(0)}" y="${Y(0)}" width="${X(3.6)-X(0)}" height="${0.3*130}" fill="${pat('rc')}" class="h" style="stroke:var(--ink);stroke-width:1.6"/>`;
  s+=`<rect x="${X(0)}" y="${Y(0.1)}" width="${X(3.6)-X(0)}" height="${0.1*130}" fill="${pat('sand')}" style="stroke:var(--ink);stroke-width:.7"/>`;
  s+=`<rect x="${X(0)}" y="${Y(3.0)}" width="${X(3.6)-X(0)}" height="${0.15*130}" fill="${pat('rc')}" style="stroke:var(--ink);stroke-width:1.6"/>`;
  s+=`<rect x="${X(-0.25)}" y="${Y(3.0)}" width="${0.25*130}" height="${3.3*130}" fill="${pat('brick')}" style="stroke:var(--ink);stroke-width:1.6"/>`;
  s+=`<rect x="${X(-0.25)}" y="${Y(2.3)}" width="${0.25*130}" height="${1.3*130}" style="fill:var(--paper);stroke:var(--ink);stroke-width:1"/><line x1="${X(-0.125)}" y1="${Y(2.3)}" x2="${X(-0.125)}" y2="${Y(1.0)}" style="stroke:var(--ink)"/>`;
  s+=`<rect x="${X(2.2)}" y="${Y(2.3)}" width="${0.9*130}" height="${2.2*130}" style="fill:none;stroke:var(--ink);stroke-width:.8"/><line x1="${X(2.2)}" y1="${Y(2.3)}" x2="${X(3.1)}" y2="${Y(1.2)}" style="stroke:var(--ink);stroke-width:.5"/><line x1="${X(3.1)}" y1="${Y(1.2)}" x2="${X(2.2)}" y2="${Y(0.1)}" style="stroke:var(--ink);stroke-width:.5"/>`;
  // door tag: circle on top of the door; window tag: diamond beside the window
  const dx=X(2.65),dy=Y(2.58);s+=`<g class="rtag"><line x1="${dx}" y1="${dy+19}" x2="${dx}" y2="${Y(2.3)}"/><circle cx="${dx}" cy="${dy}" r="19"/><text x="${dx}" y="${dy}">D13</text></g>`;
  const wx=X(0.3),wy=Y(1.65);s+=`<g class="rtag"><line x1="${X(0)}" y1="${wy}" x2="${wx-24}" y2="${wy}"/><polygon points="${wx},${wy-21} ${wx+24},${wy} ${wx},${wy+21} ${wx-24},${wy}"/><text x="${wx}" y="${wy}">W24</text></g>`;
  const ch=(cls,x,pts)=>{let c=`<g class="${cls}"><line x1="${x}" y1="${Y(pts[0])}" x2="${x}" y2="${Y(pts[pts.length-1])}" style="stroke:var(--accent);stroke-width:1"/>`;pts.forEach(v=>c+=`<line x1="${x-6}" y1="${Y(v)+6}" x2="${x+6}" y2="${Y(v)-6}" style="stroke:var(--accent);stroke-width:1.6"/>`);for(let k=0;k<pts.length-1;k++){const m=(Y(pts[k])+Y(pts[k+1]))/2;c+=`<text x="${x-7}" y="${m}" text-anchor="middle" transform="rotate(-90 ${x-7} ${m})" style="font-size:13px;fill:var(--accent);font-weight:600">${(pts[k+1]-pts[k]).toFixed(2)}</text>`}return c+'</g>'};
  s+=ch('ic win',X(0.75),[0.1,1.0,2.3,2.85]);s+=ch('ic room',X(1.45),[0.1,2.85]);s+=ch('ic door',X(3.35),[0.1,2.3]);
  s+=`<text x="${X(1.6)}" y="${Y(3.0)-7}" style="font-size:11px">S.L. +6.35</text><text x="${X(0.83)}" y="${Y(0.1)-8}" style="font-size:11px;font-weight:600">F.F.L. +3.45</text>`;
  return `<svg class="dwg" viewBox="20 0 560 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Internal dimension lines with door and window tags">${s}</svg>`}
add({id:'intdim',t:'Internal dimension lines',part:P5,html:()=>H('Internal vertical dimensions',P5)+`<div class="sb"><div class="fig grow"><div class="cap"><span>Typical room, first floor</span><span>1:25</span></div><div class="area" id="intDim"></div></div><div class="col"><p class="lead">Inside each room, dimension what someone on site needs to set out, measured from the F.F.L.</p><div class="toggles" id="icT"><button data-c="room" aria-pressed="true">Clear height</button><button data-c="win" aria-pressed="true">Window</button><button data-c="door" aria-pressed="true">Door</button></div><ul class="pts"><li><b>Clear height</b> 2.75: F.F.L. to the underside of the slab (3.00 − 0.10 finishes − 0.15 slab).</li><li><b>Window</b>: sill 0.90, window 1.30, then 0.55 to the ceiling. Together they make 2.75. Its tag goes in a <b>diamond</b>: W24.</li><li><b>Door</b> 2.20 high. Its tag goes in a <b>circle</b> on top of the door: D13.</li></ul><p class="callout">Internal dimensions start at the finished floor, not at the slab. Tags match the door and window schedules.</p></div></div>`,

add({id:'trychain',t:'Try it: complete the chain',part:P5,html:()=>H('<span class="activity-tag">Try it</span> Complete the chain',P5)+`<div class="sb even"><div class="fig grow"><div class="cap"><span>Chain 1 has three missing values</span><span>a · b · c</span></div><div class="area" id="ccSvg"></div></div><div class="col"><p>Use the facts below to find <b class="cutc">a</b>, <b class="cutc">b</b> and <b class="cutc">c</b> in metres.</p><ul class="pts" style="font-size:.9em"><li>Ground F.F.L. is +0.45. The door head is at +2.65.</li><li>All windows are the same height as the first-floor window.</li><li>The roof slab level is +9.35, and the top of the second-floor window is at +8.65.</li></ul><div id="ccQs" style="display:grid;gap:8px"></div><button class="btn primary" id="ccCheck" style="justify-self:start">Check</button></div></div>`,

    const Q=[['a','Door height',2.20,'2.65 − 0.45 = 2.20'],['b','Second-floor window height',1.30,'Same as the first floor: 5.65 − 4.35 = 1.30'],['c','Window head to roof slab',0.70,'9.35 − 8.65 = 0.70']];
    el.querySelector('#ccQs').innerHTML=Q.map((q,i)=>`<div class="qin"><label for="cc${i}"><b class="cutc">${q[0]}</b> · ${q[1]}</label><input id="cc${i}" inputmode="decimal" placeholder="0.00"><span class="fb" id="ccf${i}"></span><span class="why" id="ccw${i}" hidden>${q[3]}</span></div>`).join('');

function levelsSvg(){
  const Y=h=>478-h*40,x0=110,x1=410;let s='';
  // schematic section
  s+=`<rect x="30" y="${Y(0)}" width="420" height="${0.7*40}" fill="${pat('soil')}"/><line x1="30" y1="${Y(0)}" x2="450" y2="${Y(0)}" style="stroke:var(--ink);stroke-width:2"/>`;
  s+=`<rect x="${x0-10}" y="${Y(10.15)}" width="10" height="${Y(0)-Y(10.15)}" fill="${pat('brick')}" class="lw"/><rect x="${x1}" y="${Y(10.15)}" width="10" height="${Y(0)-Y(10.15)}" fill="${pat('brick')}" class="lw"/>`;
  s+=`<rect x="${x0-14}" y="${Y(10.25)}" width="18" height="4" class="lw" style="fill:var(--paper)"/><rect x="${x1-4}" y="${Y(10.25)}" width="18" height="4" class="lw" style="fill:var(--paper)"/>`;
  s+=`<rect x="${x0}" y="${Y(0.45)}" width="${x1-x0}" height="${0.37*40}" fill="${pat('pc')}" class="lt"/>`;
  [3.35,6.35,9.35].forEach((S,i)=>{s+=`<rect x="${x0}" y="${Y(S)}" width="${x1-x0}" height="${0.15*40}" fill="${pat('rc')}" class="lw"/><rect x="${x0}" y="${Y(S+(i<2?0.10:0.24))}" width="${x1-x0}" height="${(i<2?0.10:0.24)*40}" fill="${pat('sand')}" class="lt"/>`});
  // zoom box on the first floor
  s+=`<rect x="${x1-90}" y="${Y(3.75)}" width="100" height="${0.7*40}" class="zbox"/>`;
  // external levels
  const ext=(h,val,lab,below)=>{const y=Y(h);return `<g class="xl"><line x1="${x1+10}" y1="${y}" x2="530" y2="${y}"/><polygon points="${505},${y-11} ${517},${y-11} ${511},${y}"/><text x="536" y="${y+(below?11:-2)}"><tspan class="v">${val}</tspan> ${lab}</text></g>`};
  s+=ext(10.25,'+10.25','T.O.C.')+ext(10.15,'+10.15','T.O.P.',1)+ext(9.59,'+9.59','ROOF FINISH',1)+ext(6.45,'+6.45','2ND F.F.L.')+ext(3.45,'+3.45','1ST F.F.L.')+ext(0.45,'+0.45','G.F.L.')+ext(0,'±0.00','STREET',1);
  s+=`<text class="hd" x="460" y="${Y(11.3)}">EXTERNAL LEVELS</text>`;
  // internal spot levels
  [[0.45,'+0.45'],[3.45,'+3.45'],[6.45,'+6.45'],[9.59,'+9.59']].forEach(([h,t])=>s+=`<g class="sp"><rect x="170" y="${Y(h)-10}" width="14" height="8" fill="${pat('fill')}"/><text x="189" y="${Y(h)-3}">${t}</text></g>`);
  s+=`<text class="hd" x="${x0+10}" y="${Y(11.3)}">INTERNAL SPOT LEVELS</text><line class="ldr" x1="${x0+60}" y1="${Y(11.1)}" x2="178" y2="${Y(9.59)-12}"/>`;
  // zoom inset: F.F.L. and S.L.
  const ix=690,iy=330,k=700,IY=h=>iy-h*k;
  s+=`<line class="ldr" x1="${x1+10}" y1="${Y(3.75)}" x2="${ix-40}" y2="${IY(0.16)}"/><text class="hd" x="${ix-40}" y="${IY(0.10)-30}">ZOOM: FIRST FLOOR</text>`;
  s+=`<rect x="${ix-40}" y="${IY(0)}" width="230" height="${0.15*k}" fill="${pat('rc')}" class="lw"/>`;
  [[0,0.06,'sand'],[0.06,0.08,'mortar'],[0.08,0.10,'tile']].forEach(([a,b,p])=>s+=`<rect x="${ix-40}" y="${IY(b)}" width="230" height="${(b-a)*k}" fill="${pat(p)}" class="lt"/>`);
  s+=`<g class="xl"><line x1="${ix+190}" y1="${IY(0.10)}" x2="${ix+215}" y2="${IY(0.10)}"/><polygon points="${ix+204},${IY(0.10)-11} ${ix+216},${IY(0.10)-11} ${ix+210},${IY(0.10)}"/><text x="${ix+100}" y="${IY(0.10)-8}" text-anchor="middle"><tspan class="v">+3.45</tspan> F.F.L. · top of tiles</text>`;
  s+=`<line x1="${ix+190}" y1="${IY(0)}" x2="${ix+215}" y2="${IY(0)}"/><polygon points="${ix+204},${IY(0)+11} ${ix+216},${IY(0)+11} ${ix+210},${IY(0)}"/><text x="${ix+100}" y="${IY(-0.15)+22}" text-anchor="middle"><tspan class="v">+3.35</tspan> S.L. · top of slab</text></g>`;
  s+=`<g class="fin"><line x1="${ix-52}" y1="${IY(0.10)}" x2="${ix-52}" y2="${IY(0)}"/><text x="${ix-58}" y="${IY(0.05)+4}" text-anchor="end">0.10</text></g>`;
  s+=`<text class="eq" x="${ix+75}" y="${IY(-0.15)+56}" text-anchor="middle">F.F.L. = S.L. + 0.10</text>`;
  return `<svg class="det lvls" viewBox="20 0 900 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="External and internal levels on a section, with F.F.L. and S.L.">${s}</svg>`}
add({id:'levels',t:'Levels',part:P5,html:()=>H('Levels',P5)+`<div class="sb"><div class="fig grow"><div class="cap"><span>Levels on Section A–A</span><span>Outside · inside · zoom</span></div><div class="area" id="lvSvg"></div></div><div class="col"><ol class="pts num"><li><b>±0.00 is the street level</b>, the datum. Write every level in metres, with two decimals and a sign: +3.45, −1.80, ±0.00.</li><li><b>External levels</b> go outside the section, one mark per level: T.O.C., T.O.P., each F.F.L., G.F.L. and street level.</li><li><b>Internal levels</b>: a spot level on the floor inside each space.</li><li><b>F.F.L.</b> is the top of the tiles; <b>S.L.</b> is the top of the structural slab. On a typical floor F.F.L. = S.L. + 0.10.</li></ol></div></div>`,
  init(el){el.querySelector('#lvSvg').innerHTML=levelsSvg()}});

add({id:'trylevel',t:'Try it: find the level',part:P5,html:()=>H('<span class="activity-tag">Try it</span> Find the level',P5)+`<div class="sb even"><div class="col"><p class="lead">Use the layer thicknesses from Part 2. Give each answer in metres with its sign.</p><div id="lvQs" style="display:grid;gap:8px"></div><button class="btn primary" id="lvCheck" style="justify-self:start">Check</button></div><div class="col"><div class="infocard"><span class="k">Layer reminder</span><p style="font-size:.9em"><b>Typical:</b> tiles 2 · mortar 2 · sand 6 on the R.C. slab.<br><b>Roof:</b> tiles 2 · mortar 2 · sand 6 · sloped P.C. 7 av. · insulation 5 · D.P.C. 2 on the R.C. slab.<br><b>Basement:</b> tiles 2 · mortar 2 · sand 6 · P.C. 10 · D.P.C. 2 · P.C. 15.</p></div><div class="result" id="lvRes">Three questions.</div></div></div>`,
  init(el){const Q=[['Second-floor S.L. is +6.35. What is its F.F.L.?',6.45,'+6.35 + 0.10 = +6.45'],['Roof S.L. is +9.35. What is the average level of the top of the roof tiles?',9.59,'+9.35 + 0.24 = +9.59'],['Basement F.F.L. is −1.80. What is the level of the bottom of the D.P.C.?',-2.02,'−1.80 − (0.02 + 0.02 + 0.06 + 0.10 + 0.02) = −2.02']];
    el.querySelector('#lvQs').innerHTML=Q.map((q,i)=>`<div class="qin"><label for="lv${i}">${q[0]}</label><input id="lv${i}" inputmode="text" placeholder="+0.00"><span class="fb" id="lvf${i}"></span><span class="why" id="lvw${i}" hidden>${q[2]}</span></div>`).join('');
    el.querySelector('#lvCheck').onclick=()=>{let n=0;Q.forEach((q,i)=>{const raw=String(el.querySelector('#lv'+i).value).trim().replace(',','.').replace('−','-').replace('±','');const v=parseFloat(raw);const ok=!isNaN(v)&&Math.abs(v-q[1])<0.006;if(ok)n++;const f=el.querySelector('#lvf'+i);f.textContent=isNaN(v)?'Enter a level':ok?'Correct':'Not yet';f.className='fb '+(ok?'ok':'no');el.querySelector('#lvw'+i).hidden=isNaN(v)});const r=el.querySelector('#lvRes');r.textContent=`${n} of 3 correct.`+(n===3?'':' Watch the sign below ±0.00.');r.className='result '+(n===3?'good':'badr')}}});

add({id:'sheet',t:'The section as a working drawing',part:P5,html:()=>H('The section as a working drawing',P5)+`<div class="col" style="min-height:0"><div class="toggles" id="shopT"></div><div class="sheet"><div class="sarea" id="shopSec"></div><div class="tblock"><div><span class="k">Project</span><span class="v">Mixed-use building (teaching example)</span></div><div><span class="k">Legend</span><div class="legend" id="shopLeg"></div><span class="k" style="margin-top:8px">Notes</span><span style="display:block">Levels in metres from street ±0.00. Read with the structural drawings. Do not scale.</span></div><div><span class="k">Drawing</span><span class="big">SECTION A–A</span></div><div class="g2"><div><span class="k">Scale</span><span class="v">1:50</span></div><div><span class="k">No.</span><span class="v">A-301</span></div><div><span class="k">Rev.</span><span class="v">B</span></div><div><span class="k">Date</span><span class="v">15.10.2026</span></div></div></div></div></div>`,

add({id:'checklist',t:'Final checklist',part:P5,html:()=>H('<span class="activity-tag">Try it</span> Final checklist',P5)+`<div class="sb"><div class="col"><p class="lead">Before you hand in, open your own section and tick each item you can find on it.</p><div class="checklist" id="chk"></div></div><div class="col"><div class="result" id="chkRes"></div><p class="callout">Your ticks stay on this device only, so you can come back to the list while you work.</p><button class="btn" id="chkReset" style="justify-self:start">Clear my ticks</button></div></div>`,
  init(el){let saved=[];try{saved=JSON.parse(localStorage.getItem('secdeck-check3')||'[]')}catch(e){}
    const host=el.querySelector('#chk');host.innerHTML=`<div class="bar2"><i id="chkBar"></i></div>`+CHECK.map((t,i)=>`<label><input type="checkbox" id="ck${i}" ${saved.includes(i)?'checked':''}> <span>${t}</span></label>`).join('');
    const upd=()=>{const on=CHECK.map((_,i)=>el.querySelector('#ck'+i).checked);const n=on.filter(Boolean).length;el.querySelector('#chkBar').style.width=(n/CHECK.length*100)+'%';const r=el.querySelector('#chkRes');r.textContent=n===CHECK.length?'Everything is there. Ready to hand in.':`${n} of ${CHECK.length} found on your drawing.`;r.className='result '+(n===CHECK.length?'good':'');try{localStorage.setItem('secdeck-check3',JSON.stringify(on.map((v,i)=>v?i:-1).filter(i=>i>=0)))}catch(e){}};
    host.addEventListener('change',upd);el.querySelector('#chkReset').onclick=()=>{CHECK.forEach((_,i)=>el.querySelector('#ck'+i).checked=false);upd()};upd()}});

const ERRS=[{id:'dpc',x:30,y:300,w:200,h:96,t:'Ground floor table: the D.P.C. is missing between the two P.C. layers.'},{id:'hatch',x:80,y:66,w:22,h:274,t:'The brick wall is hatched as reinforced concrete.'},{id:'lvl',x:560,y:170,w:100,h:30,t:'S.L. +3.45 marks the top of the tiles. That is the F.F.L.; the S.L. would be +3.35.'},{id:'chain',x:520,y:70,w:40,h:120,t:'The chain does not add up: 0.90 + 1.30 + 0.80 = 3.00, but the clear height is 2.75 (the top piece should be 0.55).'},{id:'roof',x:400,y:6,w:250,h:60,t:'Roof table: the insulation is listed under the D.P.C. On this course the D.P.C. lies directly on the slab.'}];
function errSvg(){let s='';
  s+=`<rect x="100" y="340" width="460" height="22" fill="${pat('fill')}" style="stroke:var(--ink);stroke-width:1"/><line x1="40" y1="362" x2="620" y2="362" style="stroke:var(--ink);stroke-width:2"/>`;
  s+=`<rect x="100" y="332" width="460" height="8" fill="${pat('pc')}" style="stroke:var(--ink);stroke-width:1"/>`;
  s+=`<rect x="80" y="40" width="20" height="300" fill="${pat('rc')}" style="stroke:var(--ink);stroke-width:2"/>`;
  s+=`<rect x="100" y="190" width="460" height="15" fill="${pat('rc')}" style="stroke:var(--ink);stroke-width:2"/><rect x="100" y="184" width="460" height="6" fill="${pat('sand')}" style="stroke:var(--ink);stroke-width:.7"/>`;
  s+=`<rect x="100" y="60" width="460" height="15" fill="${pat('rc')}" style="stroke:var(--ink);stroke-width:2"/><rect x="100" y="48" width="460" height="12" fill="${pat('screed')}" style="stroke:var(--ink);stroke-width:.7"/>`;
  s+=`<rect x="300" y="101" width="80" height="49" style="fill:none;stroke:var(--ink);stroke-width:.7"/><line x1="340" y1="101" x2="340" y2="150" style="stroke:var(--ink);stroke-width:.5"/>`;
  const y1=184,y2=150,y3=101,y4=75;s+=`<line x1="540" y1="${y1}" x2="540" y2="${y4}" style="stroke:var(--ink);stroke-width:.7"/>`;[y1,y2,y3,y4].forEach(y=>s+=`<line x1="535" y1="${y+5}" x2="545" y2="${y-5}" style="stroke:var(--ink);stroke-width:1.3"/>`);
  [[y1,y2,'0.90'],[y2,y3,'1.30'],[y3,y4,'0.80']].forEach(([a,b,t])=>{const m=(a+b)/2;s+=`<text x="534" y="${m}" text-anchor="middle" transform="rotate(-90 534 ${m})">${t}</text>`});
  s+=`<line x1="510" y1="${y1}" x2="510" y2="${y4}" style="stroke:var(--ink);stroke-width:.7"/>`;[y1,y4].forEach(y=>s+=`<line x1="505" y1="${y+5}" x2="515" y2="${y-5}" style="stroke:var(--ink);stroke-width:1.3"/>`);s+=`<text x="504" y="${(y1+y4)/2}" text-anchor="middle" transform="rotate(-90 504 ${(y1+y4)/2})">2.75</text>`;
  s+=lvlMark(580,184,'S.L. +3.45','',false)+lvlMark(580,340,'F.F.L. +0.45','',false)+lvlMark(580,362,'±0.00','',false);
  s+=`<g style="font-size:10px"><text x="36" y="316">FLOOR TILES 2</text><text x="36" y="330">MORTAR 2</text><text x="36" y="344">SAND 6</text><text x="36" y="358">P.C. 10</text><text x="36" y="372">P.C. 15</text><text x="36" y="386">BACK FILL</text></g>`;
  s+=`<g style="font-size:9.5px"><text x="406" y="18">TILES 2 · MORTAR 2 · SAND 6</text><text x="406" y="31">SLOPED P.C. 7 · D.P.C. 2</text><text x="406" y="44">INSULATION 5 · R.C. SLAB 15</text></g>`;
  s+=ERRS.map(e=>`<rect class="err-hit" data-e="${e.id}" x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="4"/>`).join('');
  return `<svg class="det" viewBox="20 0 700 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Section with five planted mistakes">${s}</svg>`}
add({id:'tryerr',t:'Try it: spot the errors',part:P5,html:()=>H('<span class="activity-tag">Try it</span> Spot the five errors',P5)+`<div class="sb"><div class="fig grow"><div class="cap"><span>A student's section</span><span id="errCount">0 of 5 found</span></div><div class="area" id="errHost" style="position:relative"></div></div><div class="col"><p class="lead">This section has <b>five</b> mistakes covering everything from today. Tap where you see one.</p><div class="found" id="errFound"></div><div class="row"><button class="btn" id="errReveal">Show all</button><button class="btn" id="errReset">Start again</button></div></div></div>`,
  init(el){const host=el.querySelector('#errHost');let got=new Set();
    const render=()=>{host.innerHTML=errSvg();host.querySelectorAll('.err-hit').forEach(r=>{if(got.has(r.dataset.e))r.classList.add('got');r.onclick=e=>{e.stopPropagation();got.add(r.dataset.e);r.classList.add('got');list()}});
      host.querySelector('svg').addEventListener('click',e=>{if(e.target.classList.contains('err-hit'))return;const m=document.createElement('div');m.className='miss';m.textContent='Looks fine here';const b=host.getBoundingClientRect();m.style.left=(e.clientX-b.left+host.scrollLeft)+'px';m.style.top=(e.clientY-b.top+host.scrollTop)+'px';host.appendChild(m);setTimeout(()=>m.remove(),900)})};
    const list=()=>{el.querySelector('#errFound').innerHTML=ERRS.filter(e=>got.has(e.id)).map(e=>`<div>${e.t}</div>`).join('');el.querySelector('#errCount').textContent=`${got.size} of 5 found`};
    el.querySelector('#errReveal').onclick=()=>{ERRS.forEach(e=>{if(!got.has(e.id))host.querySelector(`[data-e="${e.id}"]`).classList.add('reveal')});el.querySelector('#errFound').innerHTML=ERRS.map(e=>`<div style="border-color:${got.has(e.id)?'var(--ok)':'var(--cut)'}">${e.t}</div>`).join('')};
    el.querySelector('#errReset').onclick=()=>{got=new Set();render();list()};render();list()}});

const QUIZ=[['In a section, which elements get the heaviest line weight?',['Elements beyond the cut plane','Elements cut by the plane','Hidden footings','Dimension lines'],1,'Cut elements use the thickest pen. Beyond is thin and hidden is dashed.'],['On the ground floor, where does the D.P.C. go?',['Under the tiles','Between the two P.C. layers','Under the back fill','It is not needed'],1,'P.C. 15, then the D.P.C., then P.C. 10 to protect it.'],['On the roof, which layer sits directly on the R.C. slab?',['Thermal insulation','Sloped P.C.','D.P.C.','Sand'],2,'The D.P.C. lies directly on the slab and turns up behind the skirting.'],['A typical S.L. is +3.35 with 10 cm of finishes. What is the F.F.L.?',['+3.25','+3.35','+3.45','+3.55'],2,'F.F.L. = S.L. + finishes = +3.45.'],['What does the outermost external dimension chain give?',['The openings','The floor-to-floor heights','The overall height','The slab thicknesses'],2,'From the building outwards: openings, floor heights, overall height.'],['Why does a basement need tanking?',['To insulate the walls','Ground water presses on the walls as well as the floor','To level the floor','To carry the slab'],1,'The D.P.C. has to wrap the walls and the floor continuously.'],['Which AutoCAD command draws an infinite line to project a wall down from the plan?',['OFFSET','XLINE','EXTEND','MIRROR'],1,'XLINE (shortcut XL) with the V option gives a vertical construction line.'],['Floor-to-floor 3.00 m with 15 cm risers needs how many risers?',['15','18','20','30'],2,'3.00 ÷ 0.15 = 20, so two flights of 10.']];
add({id:'quiz',t:'Exit ticket',part:'Check yourself',html:()=>H('<span class="activity-tag">Try it</span> Exit ticket','Check yourself')+`<div class="col" style="min-height:0"><div class="row"><span class="mono" id="qScore">0 of ${QUIZ.length} answered</span></div><div class="quiz" id="quiz"></div></div>`,
  init(el){const host=el.querySelector('#quiz');let right=0,done=0;host.innerHTML=QUIZ.map((q,i)=>`<div class="q" data-q="${i}"><h3>${i+1}. ${q[0]}</h3><div class="opts">${q[1].map((o,j)=>`<button data-j="${j}">${o}</button>`).join('')}</div><p class="why" hidden></p></div>`).join('');
    host.querySelectorAll('.q').forEach(qe=>{const q=QUIZ[+qe.dataset.q];qe.querySelectorAll('button').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;qe.querySelectorAll('button').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('right')});if(j!==q[2])b.classList.add('wrong');else right++;done++;const w=qe.querySelector('.why');w.hidden=false;w.textContent=(j===q[2]?'Correct. ':'Not quite. ')+q[3];el.querySelector('#qScore').textContent=`${right} correct · ${done} of ${QUIZ.length} answered`})})}});

add({id:'recap',t:'Recap',part:'Summary',html:()=>H('What to remember','Summary')+`<div class="recap2">
  <div class="rc"><span class="n">1</span><div><h3>What is a section?</h3><p>A vertical cut through the building, taken from the cut line on the plan. The cut line is a thin solid line with heavy ends; its arrows show which way you look. Rotate the plan so the arrows point away from the section, then project straight down.</p><p class="rk"><span><b class="cutc">Cut</b> heavy + hatched</span><span><b>Beyond</b> thin</span><span><b>Hidden</b> dashed</span></p></div></div>
  <div class="rc"><span class="n">2</span><div><h3>The layers of each level</h3><div class="rstk"><div><b>Street</b><span>Road ±0.00 · sidewalk +0.15</span></div><div><b>Ground</b><span>skirting 10 · tiles 2 · mortar 2 · sand 6 · P.C. 10 · <span class="cutc">D.P.C. 2</span> · P.C. 15</span></div><div><b>Typical</b><span>skirting 10 · tiles 2 · mortar 2 · sand 6 · R.C. 15 · plaster 2</span></div><div><b>Roof</b><span>tiles 2 · mortar 2 · sand 6 · inclined P.C. 7 · insulation 5 · <span class="cutc">D.P.C. 2</span> · R.C. 15 · plaster 2</span></div></div><p class="sm">At the external walls the D.P.C. wraps the tie beam and tucks into the wall; on the roof it runs up behind the sloped skirting into the parapet. Basement: the D.P.C. wraps walls and floor.</p></div></div>
  <div class="rc"><span class="n">3</span><div><h3>Drawing it in AutoCAD</h3><p class="flow">${CAD_STEPS.map((c,i)=>`<span>${i+1}. ${c.t}</span>`).join('')}</p></div></div>
  <div class="rc"><span class="n">4</span><div><h3>Stairs</h3><p>Riser 15 cm, tread 30 cm: 3.00 ÷ 0.15 = 20 risers, two flights of 10. Project every nosing from the plan, draw the steps with one polyline, then the waist and landing. Headroom at least 2.10 m.</p></div></div>
  <div class="rc wide"><span class="n">5</span><div><h3>Final checklist</h3><p class="chips">${CHECK.map(c=>`<span>${c}</span>`).join('')}</p></div></div></div>`});

['trycut','trystair','trychain','trylevel','real','tryerr'].forEach(id=>{const i=idx(id);if(i>=0)S.splice(i,1)});
{const m=S.splice(idx('mirror'),1)[0];S.splice(idx('cutline')+1,0,m)}
[6,5,4].forEach(i=>QUIZ.splice(i,1));
/* ============ DECK ENGINE ============ */
const deck=$('#deck');let cur=0;const els=[];
S.forEach((s,i)=>{const el=document.createElement('section');el.className='slide';el.setAttribute('aria-label',`Slide ${i+1}: ${s.t}`);el.innerHTML=s.html().replace('##',String(i+1).padStart(2,'0'));deck.appendChild(el);els.push(el)});
buildHatches();
S.forEach((s,i)=>{try{s.init&&s.init.call(s,els[i])}catch(e){console.error('slide',i+1,e)}});
const REF_SETS={ground:['Ground floor, platform and levels',['dpcwrap','ground','platform']],typical:['Typical floor',['typical']],window:['Windows: dimensions and labels',['window']],roof:['Roof layers and details',['roof']],stair:['Entrance stair',['stair']]};
function openRef(k){const r=REF_SETS[k];$('#rTitle').textContent=r[0];$('#rBody').innerHTML=r[1].map(x=>`<img src="${REFS[x]}" alt="${r[0]} detail from the course lecture">`).join('')+'<p>Detail from the course lecture. Values in the deck follow the current layer lists.</p>';const m=$('#refModal');m.hidden=false;m._opener=document.activeElement;$('#rClose').focus()}
function closeRef(){const m=$('#refModal');m.hidden=true;if(m._opener&&m._opener.focus)m._opener.focus()}
$('#rClose').onclick=closeRef;$('#refModal').addEventListener('click',e=>{if(e.target.id==='refModal')closeRef()});
[].forEach(([id,k])=>{const el=els[idx(id)];if(!el)return;const cols=el.querySelectorAll('.sb > .col');const c=cols[cols.length-1];if(!c)return;const b=document.createElement('button');b.className='btn refbtn';b.textContent='Lecture reference';b.onclick=()=>openRef(k);c.appendChild(b)});
paintSwatches();
const jump=$('#jump');jump.innerHTML=S.map((s,i)=>`<option value="${i}">${i+1}. ${s.t}</option>`).join('');
function go(n,src){n=Math.max(0,Math.min(S.length-1,n));if(n===cur&&els[n].classList.contains('on'))return;const back=n<cur;
  const prev=S[cur];if(els[cur].classList.contains('on')&&prev.leave)prev.leave.call(prev,els[cur]);els[cur].classList.remove('on','back');
  cur=n;els[n].classList.add('on');els[n].classList.toggle('back',back);els[n].scrollTop=0;
  if(S[n].enter)S[n].enter.call(S[n],els[n]);
  $('#count').textContent=`${n+1} / ${S.length}`;jump.value=n;$('#prev').disabled=n===0;$('#next').disabled=n===S.length-1;
  $('#progress').style.width=((n+1)/S.length*100)+'%';
  try{history.replaceState(null,'','#s'+(n+1))}catch(e){}
  if(src!=='remote')Live.slideChanged(n);
}
window.go=go;
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);jump.onchange=()=>go(+jump.value);
$('#fsBtn').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
document.addEventListener('keydown',e=>{if(!$('#refModal').hidden){if(e.key==='Escape')closeRef();return}if(!$('#modal').hidden){if(e.key==='Escape')closeLayers();return}const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&t.tagName!=='BUTTON')){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);
  else if(e.key==='f'||e.key==='F')$('#fsBtn').click()});
let tx=null;deck.addEventListener('touchstart',e=>{tx=e.target.closest('svg,canvas,input,.sorter,.viewer')?null:e.touches[0].clientX},{passive:true});
deck.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));tx=null},{passive:true});

/* ============ LIVE: follow the lecturer (room) ============ */
const Live={room:null,owner:false,students:0,slideChanged(){}};
(async function(){
  if(!window.claude||!window.claude.use)return;
  let room=null,user=null;try{[room,user]=await Promise.all([window.claude.use('room'),window.claude.use('user')])}catch(e){}
  if(!room)return;Live.room=room;
  let owner=false;try{owner=user?(!!(await user.canEdit())):false}catch(e){}
  Live.owner=owner;const btn=$('#live'),txt=$('#liveTxt');btn.hidden=false;
  if(owner){
    let broadcast=true;
    const send=()=>{if(broadcast)try{room.emit('slide',{n:cur,at:Date.now()}).catch(()=>{})}catch(e){}};
    Live.slideChanged=()=>send();setInterval(send,4000);
    const upd=()=>{btn.classList.toggle('on',broadcast);txt.textContent=broadcast?`Presenting · ${Live.students} following`:'Not presenting'};
    btn.onclick=()=>{broadcast=!broadcast;upd();send()};
    try{room.presence({role:'presenter'}).catch(()=>{})}catch(e){}
    try{room.onPeers(ch=>{const ps=(ch&&ch.peers)||[];Live.students=ps.filter(p=>p&&!p.isMe&&p.kind==='viewer'&&p.presence&&p.presence.role==='student').length;upd();if(ch&&ch.joined&&ch.joined.length)send()})}catch(e){}
    upd();send();
  } else {
    let following=true,last=-1;
    const upd=()=>{btn.classList.toggle('on',following);txt.textContent=following?'Following the lecturer':'Exploring on my own'};
    btn.onclick=()=>{following=!following;upd();if(following&&last>=0)go(last,'remote')};
    try{room.presence({role:'student'}).catch(()=>{})}catch(e){}
    try{room.on('slide',(m)=>{if(!m||m.isMe)return;const n=m.data&&typeof m.data.n==='number'?Math.floor(m.data.n):-1;if(n<0||n>=S.length)return;if(n!==last){last=n;if(following&&n!==cur)go(n,'remote')}})}catch(e){}
    upd();
  }
})();

const h0=/^#s(\d+)$/.exec(location.hash||'');go(h0?(+h0[1]-1):0);
const re=()=>buildHatches();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',re);
new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();

</script>
